[workspace]
# Greenfield project — atomic-first design.
# docs/GENERATED.md is the cascade output of typed primitives (add-section,
# set-section-*, append-changelog-entry-v2). Authoring happens through the
# Mnemosyne MCP server, not by editing GENERATED.md directly.
docs = ["docs/GENERATED.md"]
default_doc = "docs/GENERATED.md"

[schema]
changelog_titles = ["Changelog"]
entry_id_prefix = "Round "

[style]
locale = "en"

# Round 9 — privacy redaction of third-party identifiers from publishable
# half of changelog entries. audit_* half retains the original frozen body
# per R294 schema design. Section side handled via set-section-* primitives
# (no ledger needed; Section is mutable). Section caveats lack a setter
# primitive in mnemosyne 3ff92f3 — handled by direct atomic JSON edit
# (Section-not-frozen scope; documented separately in Round 9 changelog).

