# What this repository needs from a build machine, and how it is verified.
#
# Machine names, addresses and accounts are deliberately ABSENT: this repository
# is public, and the registry that maps a requirement to a machine lives outside
# it (`~/.claude/remote-build/hosts.toml` + `~/.ssh/config`). A new machine is a
# line there, not an edit here.

send    = "tracked"
# `target/` is a SYMLINK into a shared compressed volume (R1489). rsync would
# carry a broken link to the far side, and `cargo clean` deletes the link
# itself — after which cargo silently rebuilds into a real directory on the
# root filesystem, which is the incident that volume exists to prevent.
exclude = ["/target"]

# `cargo` builds it; `python3` drives every demo (`tools/rpc_verify.py`).
needs = ["cargo", "python3"]

# What the workspace links or generates against, plus a virtual display.
#
# ALSA headers are needed because `examples/hello-audio-device` enables
# `pinion-audio/cpal-backend` and opens a real output device.
#
# ★★★ R1688 — `libxml2-dev` and `libclang-dev` were MISSING, reported by a
# consumer building on a clean machine. `sce-build` build-depends on the
# `libxml` crate; its `build.rs` probes `pkg-config libxml-2.0` and PANICS when
# that is absent, then runs bindgen, which loads libclang. `pinion-forge`
# build-depends on `sce-build`, and every example build-depends on
# `pinion-forge` — so both are on the path of `cargo test --workspace --no-run`,
# which is this file's own `build` command.
#
# They were invisible for the reason a missing declaration usually is: every
# machine this tree had been built on already had them for other reasons (this
# one has `libclang1-19` via a clang install, and GitHub's runner image ships
# both), so the requirement only shows on a machine that has neither. A
# declaration that is only ever read on machines that already satisfy it is not
# a declaration, it is a coincidence.
packages = [
    "libfontconfig1-dev",
    "libxkbcommon-dev",
    "libasound2-dev",
    "libxml2-dev",
    "libclang-dev",
    "xvfb",
]

# A silent sound card, for `examples/hello-audio-device` only. Not a package:
# `snd-dummy` is a kernel module, so a machine satisfies this by having it
# loaded (`modprobe snd-dummy`, and a line in `/etc/modules-load.d/` to survive
# a reboot). Stated here because a missing card does not read as missing — the
# demo boots, opens no device, and the surface measures differently from one
# that did.
modules = ["snd-dummy"]

min_ram_gb  = 16
min_free_gb = 40

[commands]
# The two that need no display. This is what CI's `lint-and-test` job runs, so
# a green here means the same thing it means there.
build  = "cargo test --workspace --no-run"
verify = "cargo test --workspace --no-fail-fast"

# The demo sweep needs the display `xvfb` provides; run it under `xvfb-run`.
# Kept out of `verify` on purpose: a machine that has the package but no
# running server would fail 223 surfaces for one reason that has nothing to do
# with the tree.
sweep  = "xvfb-run -a bash tools/sweep_headless.sh"

# `peak_gb_per_task` is deliberately absent. The number this repository has
# measured (`jobs = 32` OOM-killing `cargo test --workspace`) is about the
# BUILD's parallelism, not about what one test holds, and inventing a per-test
# figure would make the executor's RAM arithmetic confidently wrong.
