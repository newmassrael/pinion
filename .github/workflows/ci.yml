name: CI

# R835 §5.16 — the full verification gate runs HERE, not on the
# developer's machine. Local round work uses windowless `cargo test` +
# `clippy` (+ a few affected demos run hidden via PINION_HIDDEN_WINDOW);
# the full RPC demo sweep — especially the live-pixel / x11grab guards —
# runs only in CI so it never flashes windows on the developer's display.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: clippy + workspace tests (windowless)
    runs-on: ubuntu-latest
    env:
      # R897.1 — strip debug line-tables from the test binaries. Linking every
      # crate + example test binary is what exhausted the runner disk ("No
      # space left on device", 2/2 recent pushes); the line-tables are the bulk
      # of that footprint. Backtraces lose line numbers but pass/fail is
      # unchanged, and `debug-assertions` (the test profile default) stay on.
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Free disk space (reclaim runner bloat before the test link)
        # R897.1 — GitHub runners ship ~25 GB of preinstalled SDKs the build
        # never uses; reclaim them inline (no unpinned third-party action — a
        # supply-chain surface) so the windowless test link has headroom.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show
          rustup component add clippy rustfmt
      - name: rustfmt (cargo fmt --all --check)
        # R1026.1 §6.3 — the durable, un-bypassable formatting gate. Runs
        # before the build deps + clippy so a format drift fails fast and
        # cheap (rustfmt needs only the source, no compilation). Mirrors the
        # local .githooks/pre-commit + pre-push `cargo fmt --all --check`.
        run: cargo fmt --all --check
      - name: System build deps (fontconfig for parley/fontique)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: clippy (-D pedantic via workspace.lints)
        run: cargo clippy --workspace --all-targets --features pinion-runtime/vello
      - name: workspace tests
        run: cargo test --workspace

  demo-sweep:
    name: full RPC demo sweep (Xvfb + lavapipe, hidden windows)
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      # Software Vulkan (lavapipe) on a throwaway virtual X display.
      # Windows are created UNMAPPED (PINION_HIDDEN_WINDOW) so no real
      # display is required; the full winit + wgpu + Vello render path
      # still runs (the meaningful render-pipeline coverage), it just
      # never maps a window. Best-effort: lavapipe + Xvfb is the only
      # render path available on a GPU-less runner; tune the screen
      # geometry / driver here if a demo OOMs or fails to find an adapter.
      PINION_HIDDEN_WINDOW: "1"
      PINION_SWEEP_DISPLAY: ":99"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Free disk space (reclaim runner bloat before the release build)
        # R897.1 — same headroom the test job needs: the full release-workspace
        # build + binaries are disk-heavy on a GPU-less runner.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: System deps (fontconfig, Xvfb, lavapipe, ffmpeg, XTEST, x11-utils)
        run: |
          sudo apt-get update
          # libxkbcommon-x11-0: winit's xkbcommon-dl dlopens
          # libxkbcommon-x11.so.0 at X11-backend boot; the -dev package
          # alone does not pull the x11 runtime library in.
          sudo apt-get install -y \
            pkg-config libfontconfig1-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libwayland-dev \
            xvfb mesa-vulkan-drivers vulkan-tools libvulkan1 \
            ffmpeg x11-utils gcc libxtst-dev libx11-dev python3
      - name: Build workspace (release — sweep runs release binaries)
        run: cargo build --release --workspace
      - name: Run full demo sweep under Xvfb
        run: |
          Xvfb :99 -screen 0 1600x1200x24 >/tmp/xvfb.log 2>&1 &
          sleep 3
          export DISPLAY=:99
          vulkaninfo --summary 2>/dev/null | head -30 || true
          bash tools/sweep_headless.sh
