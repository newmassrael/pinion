name: CI

# R835 §5.16 — the full verification gate runs HERE, not on the
# developer's machine. Local round work uses windowless `cargo test` +
# `clippy` (+ a few affected demos run hidden via PINION_HIDDEN_WINDOW);
# the full RPC demo sweep — especially the live-pixel / x11grab guards —
# runs only in CI so it never flashes windows on the developer's display.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: clippy + workspace tests (windowless)
    runs-on: ubuntu-latest
    env:
      # R897.1 — strip debug line-tables from the test binaries. Linking every
      # crate + example test binary is what exhausted the runner disk ("No
      # space left on device", 2/2 recent pushes); the line-tables are the bulk
      # of that footprint. Backtraces lose line numbers but pass/fail is
      # unchanged, and `debug-assertions` (the test profile default) stay on.
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Free disk space (reclaim runner bloat before the test link)
        # R897.1 — GitHub runners ship ~25 GB of preinstalled SDKs the build
        # never uses; reclaim them inline (no unpinned third-party action — a
        # supply-chain surface) so the windowless test link has headroom.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show
          rustup component add clippy rustfmt
      - name: rustfmt (cargo fmt --all --check)
        # R1026.1 §6.3 — the durable, un-bypassable formatting gate. Runs
        # before the build deps + clippy so a format drift fails fast and
        # cheap (rustfmt needs only the source, no compilation). Mirrors the
        # local .githooks/pre-commit + pre-push `cargo fmt --all --check`.
        run: cargo fmt --all --check
      - name: System build deps (fontconfig for parley/fontique, ALSA for cpal)
        # R1310 — libasound2-dev: `examples/hello-audio-device` turns on
        # `pinion-audio/cpal-backend` (it opens a REAL output device so a real
        # audio callback thread runs), and cpal links ALSA on Linux. It is the
        # one workspace member that does, so a `--workspace` build now needs the
        # ALSA headers. The pinion-audio *crate* keeps the backend optional, so a
        # checkout that does not build the examples still compiles without them.
        run: |
          sudo apt-get update
          # R1688 — libxml2-dev + libclang-dev: `sce-build` build-depends on the
          # `libxml` crate, whose build script probes `pkg-config libxml-2.0`
          # (panicking when absent) and then runs bindgen, which loads libclang.
          # Every example build-depends on `pinion-forge`, which build-depends on
          # `sce-build`, so both are on the path of any `--workspace` build. The
          # runner image happens to ship them, which is exactly why this was
          # missing everywhere for so long — declared now so a change to that
          # image is a failure with a name rather than a mystery.
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev \
            libasound2-dev libxml2-dev libclang-dev
      - uses: Swatinem/rust-cache@v2
      - name: clippy (-D pedantic via workspace.lints)
        run: cargo clippy --workspace --all-targets --features pinion-runtime/vello
      - name: cargo doc (broken intra-doc link gate, incl. private items)
        # R1214 — `warnings = "deny"` (workspace.lints) promotes rustdoc lints
        # (broken_intra_doc_links / redundant_explicit_links /
        # private_intra_doc_links) to errors, so a plain `cargo doc` fails on
        # any regression. This gate was absent until R1214, which is why ~1000
        # broken links accreted invisibly from ~R683 (CI ran clippy, never
        # rustdoc). Mirrors the .githooks pre-commit + pre-push doc gate.
        #
        # R1218 — added `--document-private-items`. Without it rustdoc only
        # checks links in PUBLIC items' docs; broken links in private items'
        # docs (a further ~150) were an ungated blind spot. Now the whole doc
        # surface is gated.
        run: cargo doc --workspace --no-deps --features pinion-runtime/vello --document-private-items
      - name: workspace tests
        run: cargo test --workspace
      - name: analysis-tool census proofs
        # ★★★★★ R1804 — placed HERE, immediately after `cargo test --workspace`,
        # and the position is the whole point. This gate runs
        # `cargo test -- --list` to check that every `proven_by` the census
        # cites is a test that actually runs; the step above has just built
        # every one of those binaries, so here it costs a listing.
        #
        # On a developer's push it cost a second full compile of the workspace:
        # measured over five pushes at 8s on the one round that touched no Rust
        # and 154s, 174s, 154s, 248s on the rounds that did. The hook's own
        # comment had called it "3.5s on a warm tree", which was true and
        # useless — most rounds are not warm.
        #
        # ⚠ ADDED HERE BEFORE BEING REMOVED FROM `pre-push`, deliberately and in
        # that order: this check exists nowhere else, so dropping it locally
        # first would leave the claim unguarded for however long it took to
        # notice. The local step goes once this has been green.
        run: python3 tools/analyzer_census.py --check-proofs

  demo-sweep:
    name: full RPC demo sweep (Xvfb + lavapipe, hidden windows)
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      # Software Vulkan (lavapipe) on a throwaway virtual X display.
      # Windows are created UNMAPPED (PINION_HIDDEN_WINDOW) so no real
      # display is required; the full winit + wgpu + Vello render path
      # still runs (the meaningful render-pipeline coverage), it just
      # never maps a window. Best-effort: lavapipe + Xvfb is the only
      # render path available on a GPU-less runner; tune the screen
      # geometry / driver here if a demo OOMs or fails to find an adapter.
      PINION_HIDDEN_WINDOW: "1"
      PINION_SWEEP_DISPLAY: ":99"
      # R1330 — the "Build workspace" step below is the freshness build, so the
      # sweep must not run its own `cargo build --release --workspace` on top of it
      # (it does so by default now, to protect a local run from a stale binary).
      # This flag makes the sweep trust the prior step. NOTE (R1333, corrected): the
      # "Build workspace" step is LOAD-BEARING — with this flag set the harness runs
      # `ensure_build=False`, so a present-but-stale `target/release/<ex>` is run
      # DIRECTLY; only a MISSING binary self-heals via the `cargo run` fallback. Since
      # rust-cache restores `target/`, removing the build step would silently run
      # stale binaries. Keep the build step whenever this flag is set.
      PINION_SWEEP_NO_BUILD: "1"
      # R1472 — set at JOB level, not on the pre-build step, and that placement
      # is the whole point: `r1447_font_free_tui.py` runs its own `cargo test`,
      # and a profile setting that differed between the pre-build and that run
      # would change the fingerprint and rebuild everything inside the demo —
      # re-creating exactly the timeout this pre-build exists to remove, while
      # looking fixed. It also buys the same disk headroom R897.1 needed in the
      # test job: line-tables are the bulk of the test-binary footprint, and
      # this job now links them on top of a full release build.
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Free disk space (reclaim runner bloat before the release build)
        # R897.1 — same headroom the test job needs: the full release-workspace
        # build + binaries are disk-heavy on a GPU-less runner.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: System deps (fontconfig, Xvfb, lavapipe, ffmpeg, XTEST, x11-utils)
        run: |
          sudo apt-get update
          # libxkbcommon-x11-0: winit's xkbcommon-dl dlopens
          # libxkbcommon-x11.so.0 at X11-backend boot; the -dev package
          # alone does not pull the x11 runtime library in.
          # R1688 — libxml2-dev + libclang-dev: the SCE build's `libxml`
          # build-dependency probes pkg-config and runs bindgen. See the
          # lint-and-test job for the full note.
          # R1727 — xdotool: the harness can now drive the machine's OWN pointer
          # (`rpc_verify.RealPointer`), which is the only way to exercise a
          # gesture the way a hand makes it. Without it that demo prints a loud
          # line and skips its real-pointer sections, which is how the shape
          # R1726 shipped — a green belonging to a gesture nobody performs —
          # comes back. Arming it here is what keeps it out.
          sudo apt-get install -y \
            pkg-config libfontconfig1-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libwayland-dev \
            xvfb mesa-vulkan-drivers vulkan-tools libvulkan1 \
            ffmpeg x11-utils gcc libxtst-dev libx11-dev python3 xdotool \
            libasound2-dev libasound2-plugins alsa-utils \
            libxml2-dev libclang-dev \
            pulseaudio pulseaudio-utils
          # R1333 — Pillow (python3-pil) is DELIBERATELY NOT installed yet. The 6
          # live-pixel / native-drag demos (r706 r707 r786 r794 r787 r806) `import
          # PIL` and SKIP the pixel guard without it, so their coverage is currently
          # VACUOUS in CI — surfaced honestly now by the sweep's SKIP tally (R1333
          # sweep_headless.sh) instead of being hidden as a fast PASS. Installing
          # Pillow to ARM them was tried and rejected for now: with Pillow present
          # r794 FAILS a native-drag assertion and r706/r707 cannot locate their
          # feature in the capture (verified locally), so arming them would turn this
          # REQUIRED gate red. Arm them (add python3-pil, make SKIP fatal) only after
          # those demos are hardened — see the KNOWN GAPS note. Making a required gate
          # honestly-partial beats making it flakily-red.
      - name: Silent audio device (userspace null sink) for the device-audio demo
        # R1325 — `hello_audio_device.py` drives a REAL cpal callback thread
        # concurrently with the RPC control thread, so it needs a real output device
        # with a real clock. A runner has none.
        #
        # R1310 tried `snd-dummy` (a timer-paced ALSA card) and it CANNOT work here:
        # the runner kernel (`6.17.0-1018-azure`) ships no such module, and installing
        # `linux-modules-extra-$(uname -r)` does not add one —
        #   modprobe: FATAL: Module snd-dummy not found in /lib/modules/6.17.0-1018-azure
        # so this step failed on EVERY push and took the whole sweep job down with it.
        # That is how 8 rotting demos (r683 / r1094 / r1099 / r1107 / r1124 / r1146 /
        # r1149 / r705) stayed red for weeks behind a gate nobody could see.
        #
        # The userspace equivalent has the same properties and no kernel dependency:
        # a PulseAudio daemon whose ONLY sink is a null sink (timer-driven, discards
        # samples), with two ALSA PCMs routed to it. VERIFIED locally against this
        # exact config: cpal opens the PCM and its callback is paced at ~44.1 kHz
        # (44132 frames/s measured), silent by construction, and the demo passes
        # end-to-end. The demo reads the PCM names from the env below, defaulting to
        # the `snd-dummy` recipe for local dev.
        #
        # Fails LOUDLY if the PCMs do not materialise: `hello-audio-device` aborts
        # rather than opening an audible default, so a missing device can never
        # masquerade as a pass ([[ignored-integration-tests-fall-through-ci]]).
        run: |
          sudo tee /etc/asound.conf > /dev/null <<'ASOUND'
          pcm.!default { type pulse }
          ctl.!default { type pulse }
          pcm.pinion_silent  { type pulse  hint { show on  description "pinion silent A" } }
          pcm.pinion_silent2 { type pulse  hint { show on  description "pinion silent B" } }
          ASOUND
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink \
            sink_name=pinion_null sink_properties=device.description=pinion_null
          pactl set-default-sink pinion_null
          aplay -L | grep -q '^pinion_silent$' || {
            echo "::error::the silent PCMs did not materialise; the audio device demo cannot run"
            pactl list short sinks || true
            aplay -L || true
            exit 1
          }
          {
            echo "PINION_SILENT_PCM=pinion_silent"
            echo "PINION_SILENT_PCM_MARK=pinion_silent"
            echo "PINION_SILENT_PCM_2=pinion_silent2"
          } >> "$GITHUB_ENV"
          pactl list short sinks
      - name: Build workspace (release — sweep runs release binaries)
        run: cargo build --release --workspace
      - name: Only the pre-warmed demo may shell out to `cargo test`
        # R1475 — closes R1474's carry: "today only one demo calls `cargo test`,
        # but nothing enforces it". The step below warms exactly that demo's
        # packages, so a second demo growing a `cargo test` call would compile
        # inside its own 180s budget and be killed — the failure R1472 and R1475
        # each spent a round diagnosing. This turns that assumption into a gate.
        run: |
          offenders=$(grep -ln '"cargo", *"test"' tools/demos/*.py \
            | grep -v 'r1447_font_free_tui\.py$' || true)
          if [ -n "$offenders" ]; then
            echo "these demos shell out to \`cargo test\` but are not pre-warmed," >&2
            echo "so they would compile inside the sweep's per-demo budget:" >&2
            echo "$offenders" >&2
            exit 1
          fi
      - name: Warm the units that demo actually builds (asked, not guessed)
        # R1472 pre-built `cargo test --workspace --no-run` here and r1447 was
        # killed at 180s anyway. R1475 measured why: cargo resolves features per
        # invocation, so `--workspace` produced `pinion-runtime[default,vello]`
        # (the GUI examples enable vello) while the demo's own
        # `cargo test -p pinion-tui` wants `pinion-runtime[default]` — a unit
        # with a different fingerprint that the workspace build never made. On
        # run 30352520291 the demo spent 123.3s before its first diagnostic line
        # and 50.8s more on the `pinion-tui` pair, while its neighbours in the
        # same sweep took 1.7-2.7s. A superset is not a warm cache; the matching
        # resolution is. The list comes from the demo (`--print-warmup`) so the
        # two cannot drift apart again.
        run: |
          demo=tools/demos/r1447_font_free_tui.py
          python3 "$demo" --print-warmup > /tmp/pinion-warmup.txt
          cat /tmp/pinion-warmup.txt
          while read -r cargo_args; do
            # shellcheck disable=SC2086  # deliberate: the demo emits the args
            cargo $cargo_args
          done < /tmp/pinion-warmup.txt
      - name: Demo harness lifecycle tests
        # R1570.3 — the harness that drives every demo below, tested before it
        # is trusted. Its teardown could leave a driven binary running while
        # raising out of the demo, and four such orphans turned four
        # deterministic sweep failures into thirty-seven that differed between
        # runs. Sub-second: no cargo, no display.
        run: python3 tools/test_rpc_verify.py
      - name: Run full demo sweep under Xvfb
        run: |
          Xvfb :99 -screen 0 1600x1200x24 >/tmp/xvfb.log 2>&1 &
          sleep 3
          export DISPLAY=:99
          vulkaninfo --summary 2>/dev/null | head -30 || true
          bash tools/sweep_headless.sh

  gpu-tests:
    name: headless GPU pixel tests (lavapipe, --ignored)
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      # R897.1 — same disk rationale as lint-and-test: strip test-binary debug
      # line-tables so the link stays within the runner disk budget.
      CARGO_PROFILE_TEST_DEBUG: "0"
      # ★ R1676 — one tile thread, so a picture is a function of the scene and
      # not of how the scheduler interleaved the tiles. Measured under this
      # runner's software Vulkan: ten captures of one unchanged screen give 3 of
      # 45 pairs byte-identical by default and 45 of 45 with this set. The demo
      # sweep gets the same property from `RpcSubprocess`, which sets it around
      # every binary it launches; these pixel guards are `cargo test` and never
      # go through that harness, so they take it here. Ignored by every driver
      # but the software one.
      LP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Free disk space (reclaim runner bloat before the test link)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: System deps (fontconfig + DejaVu mono + software Vulkan lavapipe)
        # The headless GPU pixel guards (pinion-shell HeadlessScreenshot) render
        # through wgpu + Vello to a texture and read the pixels back — NO window
        # / X display is required (Instance `display: None`, request_adapter
        # `compatible_surface: None`, so no Xvfb here, unlike demo-sweep). They
        # need only: a Vulkan ICD (lavapipe via mesa-vulkan-drivers) to supply
        # the adapter, fontconfig + a monospace face (fonts-dejavu-core) for the
        # glyph-presence assertions, and libxkbcommon-dev to link the
        # winit-bearing pinion-shell build.
        run: |
          sudo apt-get update
          # R1688 — this job builds `-p pinion-shell`, and MEASURED
          # (`cargo tree -p pinion-shell -e build,normal`) that reaches
          # `sce-build` -> `libxml`, so it needs the pkg-config file and
          # libclang too. See the lint-and-test job for the full note.
          sudo apt-get install -y \
            pkg-config libfontconfig1-dev libxkbcommon-dev \
            libxml2-dev libclang-dev \
            fonts-dejavu-core mesa-vulkan-drivers vulkan-tools libvulkan1
      - name: Run headless GPU pixel tests (#[ignore]d, lavapipe adapter)
        # R1029 §6.3 — the R99x grid + glyph pixel guards are #[ignore]d out of
        # the windowless `cargo test --workspace` (wgpu cold-boot is too slow
        # for the default suite). Run them here against software Vulkan so a
        # paint regression (e.g. the R1028 gutter / geometry-only parent-bleed)
        # is caught in CI, not only by a manual local `--ignored` run. Scoped to
        # `-p pinion-shell --lib` so it runs exactly the GPU tests and NOT the
        # other #[ignore]d tests (the pinion-platform-tray SNI D-Bus tests and
        # the pinion-text-unicode bidi UCD sweeps, which need different setup).
        #
        # R1510 — the two R806 canaries used to be dropped here by name
        # (`--skip r806`). They assert that an upstream vello bug — a 2px stroke
        # flush on the framebuffer y=0 row floods ~16px — STILL reproduces, and
        # that flood is adapter-dependent: it appears on hardware adapters and
        # NOT on lavapipe, so under software Vulkan the canaries had nothing to
        # say. Excluding them by name put that premise in this file, where the
        # tests cannot see it: run on the wrong adapter they reported that
        # UPSTREAM WAS FIXED, which is a message blaming the wrong thing.
        #
        # The premise is now a check inside them
        # (`HeadlessScreenshot::adapter_floods_top_tile`), so they RUN here and
        # skip their adapter-dependent half loudly, naming the adapter as the
        # reason. That is strictly more than the skip gave: the positive half of
        # `r806_focus_ring_top_edge_rasterizes_two_px_not_thick` — pinion's own
        # claim that the top inset keeps the ring's stroke off the flood row —
        # now gets CI coverage it never had, and the log says which half was
        # skipped instead of the run silently not containing them.
        run: |
          vulkaninfo --summary 2>/dev/null | head -30 || true
          cargo test -p pinion-shell --lib -- --ignored
          # R1066.1 — the §5.37 paint-seam pixel proofs (text_engine_paint_seam:
          # R1063 coverage blit / R1065 atlas quads / R1066 per-glyph colour) are
          # an integration test under tests/, which `--lib` above does NOT run, so
          # they were CI-invisible (the only end-to-end pixel guards of the
          # self-hosted text engine). Run that target explicitly under lavapipe.
          cargo test -p pinion-shell --test text_engine_paint_seam -- --ignored
