[workspace.package]
version = "0.0.1"
edition = "2024"
# R47.1 §5.36 — parley 0.9 transitively requires rustc 1.88 (was 1.86
# R46.3 Vello 0.6 bump). See rust-toolchain.toml comment for the trigger.
rust-version = "1.88.0"
license = "LGPL-3.0-or-later"
authors = ["pinion contributors"]

[workspace.dependencies]
# R1053 §5.4 PR-22 — SCE (statechart engine) pinned by git+rev instead of a
# `vendor/sce` path dep, so a downstream consumer (sprag) can rev-pin pinion
# itself. A `git` source_id is shareable by (url, rev); a `path` source_id is a
# local folder no git-checkout can address. pinion-core exposes SCE types
# (`Engine`/`StatePolicy`) in its public API, so pinion-core's SCE and the
# consumer's SCE must deduplicate to ONE instance — which only happens when both
# name the same (git, rev). Under the old path form, git-pinning pinion left its
# SCE at an unaddressable `~/.cargo/git/checkouts/...` hash dir, forcing the
# consumer onto a second SCE instance → `Engine`/`StatePolicy` type mismatch.
#
# DUAL-PIN DISCIPLINE: `rev` here MUST equal the `vendor/sce` submodule gitlink
# SHA. Bumping SCE = move the submodule AND this rev in the SAME commit, or the
# built SCE drifts from the vendored checkout (C++ side / canon sync still track
# the submodule). The two `rev` values below are the ONLY statement of the pin —
# an earlier version of this comment also named the SHA in prose and had drifted
# two bumps behind, which is what a duplicated constant does.
#
# R1641 — the pair is now GATED, not remembered: `pre-push` runs
#   python3 tools/pin_sync.py --check-dual-pin
# which compares this rev against Cargo.lock, the vendor/sce gitlink recorded in
# the index, and that submodule's checked-out HEAD. The check that used to live
# here was a shell one-liner in prose, run by whoever thought of it — the shape
# R1470 and R1495 cost a round each to learn is not a gate.
sce-rust-runtime = { git = "https://github.com/newmassrael/scxml-core-engine.git", rev = "a80b06d051813e8034a91127e767e91eb7e3c112", default-features = false }
sce-build = { git = "https://github.com/newmassrael/scxml-core-engine.git", rev = "a80b06d051813e8034a91127e767e91eb7e3c112" }

# §5.7 JSON-RPC 2.0 transport realized at the pinion-rpc envelope.
serde = { version = "1", features = ["derive"] }
# `raw_value` (R1480 §5.15) backs `IntrospectValue::Raw`: a producer that
# already holds encoded JSON hands the bytes over instead of a `Value` DOM
# the envelope would only re-serialize.
serde_json = { version = "1", features = ["raw_value"] }

# (R1160 §5.16) Structured, level-gated logging substrate. `tracing` is the
# Rust-standard facade ([[use-substrate-not-hand-rolled-equivalent]] — do NOT
# hand-roll an eprintln logger); `tracing-subscriber`'s `env-filter` gives
# per-target level control so any live issue is analysable immediately via
# `PINION_LOG=pinion::dock=debug` with no code churn. Span support is the forward
# path for game-loop / frame-timing profiling (Phase C). Already transitive
# (winit / wgpu); promoted to a direct dep for first-party instrumentation.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# R1541 §5.7 — the readiness wait under `pinion-rpc-transport`'s accept loop
# (`poll(2)` over the listener plus an out-of-band wake channel). rustix is a
# *safe* wrapper over the syscall, which is what makes this reachable at all:
# `libc::poll` needs `unsafe`, which `workspace.lints.rust.unsafe_code` forbids
# outright, and the readiness frameworks that would otherwise do the job carry
# their own `unsafe` in the API a consumer must call (`polling::Poller::add` is
# an `unsafe fn`). Two fds and one socketpair do not need epoll registration or
# cross-platform readiness abstraction — see `accept_loop` for why the smaller
# primitive is the right one here. Already transitive (async-io, calloop).
rustix = { version = "1.1", features = ["event"] }

# R634 §5.7 — pinion-cli developer command framework. clap is the
# de-facto Rust CLI standard; the `derive` feature avoids the
# stringly-typed builder API in favour of #[derive(Parser)] +
# #[derive(Subcommand)] sub-command routing. Sync (no tokio).
clap = { version = "4", features = ["derive"] }

# R634 §5.7 — pinion-cli HTTP transport for the design service REST API
# fetch + image export. ureq is a sync blocking client (no
# tokio runtime — pinion-cli stays sync per §6.3 framework
# boundary) with a tiny dep footprint; the `json` feature pulls
# the serde_json integration for direct typed-deserialize.
# `tls` feature uses rustls (no native OpenSSL link, portable
# across Linux/macOS/Windows for the same binary).
ureq = { version = "2", features = ["json", "tls"], default-features = false }

# §4 first dogfood (examples/hello-button + ai-introspect-demo): winit
# window. The pre-R46.5 softbuffer paint backend has been retired in
# favour of the Vello GPU path (R46.2 emit template + R46.3 first
# consumer + R46.5 second consumer); workspace softbuffer dep removed
# along with the last caller. Not consumed by the core/runtime/rpc
# crates — example-scope only.
winit = "0.30"

# §5.16 R46.3 ai-introspect-demo — block on Vello's async `new` at app
# boot per §6.3 boundary. Example-scope only; pinion-core/runtime stay
# sync (view-fn purity). Sync wrapper around futures so the example
# doesn't need a tokio runtime just for one-shot init.
pollster = "0.4"

# §5.16 R41 hybrid path C — Linebender Vello as the UI-mode 2D rasterizer
# (Phase 1, 18-24mo). R46.2 lands the first pinion-forge emit template
# targeting this backend; R46.3 wires it into ai-introspect-demo. wgpu is
# pinned to vello 0.9.x's transitive (vello 0.9.0 → wgpu 29) so consumers
# referencing `wgpu = { workspace = true }` deduplicate against vello's own
# compile. The emit template itself touches wgpu only through the
# `vello::wgpu` re-export; the direct workspace pin is forward-compatible
# slot for R47+ headless renderer template + Phase 3 custom render passes.
# R808 — bumped 0.6 → 0.9 (0.7 stroke-artifact fix / 0.8 wgpu28 / 0.9
# wgpu29 + perf) to re-verify VELLO-001 (y=0 top-tile flood) upstream.
vello = "0.9"
wgpu = "29"

# §5.20 intent system derive macro. Consumed only by pinion-derive.
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# §5.36 R47 — Linebender parley text layout + swash shaping / glyph
# rasterization. Consumed by pinion-text (the framework primitive that
# every paint backend uses for text). fontique (system font enumeration
# + fallback) follows transitively via `parley::FontContext`; promoted
# to a direct workspace dep only when pinion-text exposes fallback
# override APIs. R21 cosmic-text decision partially superseded —
# layout responsibility lives in parley for §5.16 R41 Vello ecosystem
# consistency; R31 glyph atlas GPU texture intent is preserved through
# pinion-text GlyphCache + Vello draw_glyph integration.
#
# R1659 — `default-features = false` here, and the system font SOURCE is
# re-enabled by `pinion-text`'s own `system-fonts` feature (default on, so
# nothing in this tree changes). parley's default `system` feature forwards to
# `fontique/system`, which on Linux pulls `yeslogic-fontconfig-sys` and makes
# the **fontconfig development headers a build requirement of anything that
# reaches this crate**. A consumer that only speaks pinion's JSON-RPC wire
# reaches it through `pinion-rpc`, and had no way to say it wanted neither
# pixels nor system fonts — its CI failed to build with
# "The system library `fontconfig` ... was not found", on Linux only (macOS
# takes Core Text and never links it).
#
# The switch lives HERE rather than as a `cfg` over the RPC methods that shape
# text, which is what the report proposed: measured, every one of those methods
# still compiles and answers with the source off — what changes is which fonts
# the stack can FIND, not which questions it can be asked. Gating the methods
# would have removed a capability to solve a linking problem.
parley = { version = "0.9", default-features = false, features = ["std"] }
swash = "0.2"

# §5.36 R47.2 — LRU bounded backing for pinion-text LayoutCache.
# Standard Rust LRU; consumer of NonZeroUsize at construction. Single
# workspace-shared version so future cache consumers (R47.5+ GlyphCache,
# §5.16 future damage cache, etc.) deduplicate transitively.
lru = "0.18"

# §5.40 R51.61 — AccessKit accessibility infrastructure. pinion-a11y wraps
# this with a stable pinion-native AccessNode/AriaRole/AccessAction surface so
# WidgetView trait + per-widget mappings depend only on pinion-a11y (single
# upgrade boundary). accesskit_winit lands in pinion-shell at R51.62 since the
# Adapter type is winit-coupled. Mozilla/Bevy/egui/Slint all consume this same
# crate — Rust cross-platform AT (UIA/AX/AT-SPI/Android) substrate.
accesskit = "0.24"

# §5.40 R51.62 — winit Adapter for AccessKit. Lives in pinion-shell
# (winit-coupled). Version-pinned to accesskit 0.24's compatible
# accesskit_winit 0.33; a future accesskit bump rewrites only this
# pair (pinion-shell adapter wiring + pinion-a11y substrate) — every
# widget impl keeps its declarative shape.
accesskit_winit = "0.33"

# §5.41 R51.109.0 — Rust TUI rendering library (Linebender-adjacent
# maintainer continuity; egui / iced / bubbletea-class adoption
# baseline). Cell-based scene render target sibling of the Vello
# pixel-raster pipeline (§2 #6 GUI/TUI dual). Consumed only by
# pinion-tui (the framework crate that owns the Backend trait + raw
# mode + event source); pinion-core / pinion-runtime stay free of
# ratatui transitive in non-TUI builds via the `tui` feature gate
# landing R51.109.1+.
ratatui = "0.29"

# §5.41 R51.109.0 — terminal capability + key/mouse event source.
# Transitive ratatui dep promoted to direct workspace pin so
# pinion-tui (and any future RPC-driven terminal layer) reaches
# crossterm types without going through ratatui's re-export, which
# avoids breakage when ratatui upgrades its crossterm pin.
crossterm = "0.28"

# R638 §5.7 — `pinion design-diff` CLI image decode + resize. Pulled
# via `image` (not via `imageproc` which would force a full nalgebra
# transitive); decode is the only operation the diff substrate needs
# (encode of the diff PNG goes through the already-pinned `png`
# workspace dep below to stay symmetric with R637 `HeadlessScreenshot`).
# `default-features = false` drops every codec but PNG to keep the
# CLI binary lean. SSIM gradient via `imageproc` deferred to a
# follow-up round only if MAE / max-delta prove insufficient for the
# design tool → pinion design-parity feedback loop (YAGNI per CLAUDE.md).
image = { version = "0.25", default-features = false, features = ["png"] }

# R637 §5.16 §5.7 — PNG encoder for the headless screenshot substrate.
# `png` is the de-facto Rust PNG crate (image-rs maintainer continuity);
# pulled directly (not transitively via `image`) so the only added
# compile cost is the encoder itself + `miniz_oxide` (zlib). Used by
# `pinion-shell::headless_screenshot::HeadlessScreenshot::render_to_png`
# to write RGBA8 framebuffer bytes (post-wgpu-readback) as a Web-grade
# 8-bit-per-channel PNG file. R638 (`pinion design-diff`) will pull
# `image` proper for decode + diff arithmetic; this round stays at the
# minimum surface (encode only).
png = "0.17"

# §5.37.3 R50.2.8 — criterion micro-benchmark harness. Workspace-side
# pin so future performance-instrumented crates (text shaping, BIDI,
# GSUB lookup, layout cache, etc.) share a single version. Consumers
# opt in per-crate via `criterion = { workspace = true }` under their
# own `[dev-dependencies]` table — Cargo's `workspace.dependencies`
# namespace is unified across `[dependencies]` / `[dev-dependencies]`
# / `[build-dependencies]`, the dev classification happens per-crate.
# The runtime "0 external deps" invariant of pinion-text-unicode is
# preserved because criterion never appears in the library
# compilation graph (dev-only consumer).
criterion = "0.5"

[workspace.lints.rust]
# `forbid` (vs `deny`) — rejects even per-site `#[allow]` overrides.
# CLAUDE.md frame: `unsafe_code = "forbid"`. The framework never
# requires `unsafe`; if a future axis genuinely needs it (e.g. a
# vendored FFI), the spec round must explicitly downgrade to `deny`
# at that boundary so the audit trail records the exception.
unsafe_code = "forbid"
# Treat every rustc warning as an error. The workspace baseline is
# `0` warnings (verified by `cargo clippy --workspace --all-targets
# --features pinion-runtime/vello`); promoting to `deny` codifies
# that floor — any new warning aborts the build rather than
# accumulating as drift. Aligns with the CLAUDE.md "Build and Link
# Error Priority" rule.
warnings = "deny"

[workspace.lints.clippy]
# `pedantic` group — the strictest lint set still considered
# textbook by Clippy maintainers. Already at `0` warnings on the
# current workspace; promoting `warn → deny` makes the policy
# enforced by the compiler instead of by convention.
pedantic = { level = "deny", priority = -1 }

# R1329 — codegen-unit-partitioning workaround for a release miscompilation.
#
# `hello-dock-panels-editor`'s `WidgetA11y::access_node` returns a non-empty
# `Vec<AccessNode>` that its caller (`access_node_for_window`, whose guard
# evaluates TRUE — verified by returning the comparison over the wire) receives
# as EMPTY under the default release profile. The whole AT tree then collapses to
# zero nodes (`scene/access` count 0), which is how it was found. It reproduces on
# rustc 1.88.0 and 1.94.1, in safe code (`unsafe_code = "forbid"` workspace-wide),
# and is sensitive to code that cannot affect the result: changing the NEVER-TAKEN
# `else` arm from `Vec::new()` to a one-element `vec![]` makes the taken arm return
# its nodes correctly. `-C codegen-units=1` compiles it correctly.
#
# Scoped to this package (not the whole release profile) so the workspace keeps its
# parallel-codegen build times. See the pinion memory note
# `a11y-extra-accessnodes-collapse-tree` and the `r1327_focused_pane_window_title`
# demo, whose AT-tree assertions fail loudly if this ever regresses.
[profile.release.package.hello-dock-panels-editor]
codegen-units = 1

# R1490 — stop every dev executable carrying a private copy of the framework's
# DWARF.
#
# The debug info was never duplicated at *compile* time: it lives in the rlibs,
# and the linker copies it into each binary it links. This workspace links a lot
# of them — 198 `bin` targets plus a test executable for each of the 190
# examples that carry `#[cfg(test)] mod tests` — and a binary's size barely
# depends on what the example contains (measured: 298 LOC = 148.3 MiB,
# 8,998 LOC = 155.0 MiB). `unpacked` leaves a skeleton that points at the
# rlib-resident DWARF instead.
#
# Measured on a controlled pair of cold builds of the same 20 examples
# (40 executables) into two empty target dirs on the same volume, changing only
# this setting:
#
#   tree total      5.96 -> 4.97 GiB   (-16.7%)
#   per executable  101.6 -> 74.6 MiB  (-26.6%)
#   rlib / rmeta    1.06 / 0.44 GiB    (IDENTICAL — nothing was dropped)
#   on disk (zstd)  1.6 -> 1.4 GiB     (-12.5%)
#   cargo build     105s -> 91s        (-13%; less for the linker to copy)
#   +cargo test     133s -> 119s       (-11%)
#
# Nothing is lost: `addr2line` resolves the same file:line in both builds. The
# one caveat is that a dev binary is only debuggable while its `target/` is
# intact, which is what a build cache is — release ships no DWARF at all
# (measured: 0.0 MiB of `.debug_*`), so this profile is the only one it touches.
[profile.dev]
split-debuginfo = "unpacked"
