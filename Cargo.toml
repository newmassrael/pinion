[workspace]
resolver = "3"
members = [
    "crates/pinion-core",
    "crates/pinion-runtime",
    "crates/pinion-rpc",
    "crates/pinion-cli",
    "examples/hello-button",
]
exclude = ["vendor/sce"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85.0"
license = "LGPL-3.0-or-later"
authors = ["pinion contributors"]

[workspace.dependencies]
# §5.7 JSON-RPC 2.0 transport realized at the pinion-rpc envelope.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# §4 first dogfood (examples/hello-button): winit window + softbuffer paint.
# Not consumed by the core/runtime/rpc crates — example-scope only.
winit = "0.30"
softbuffer = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
