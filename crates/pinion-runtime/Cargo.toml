[package]
name = "pinion-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Render loop and SCE hierarchical state machinery"

[features]
# Default = no GPU dep. `vello` enables the §5.16 R46.3.1 paint_adapter
# module — Scene → vello::Scene walk for the Vello render path. Kept
# behind a feature so non-GUI consumers (headless / TUI / future
# pinion-render-* alternatives) don't pull wgpu transitively.
# R1659 — `system-fonts` forwards to `pinion-text`'s switch of the same name:
# ON here, unlike `vello`, because it is on TODAY and a default that quietly
# stopped a consumer's text from finding any font would be a behaviour change
# wearing a feature flag. A headless consumer takes this crate with
# `default-features = false` and gets no fontconfig build requirement.
default = ["system-fonts"]
system-fonts = ["pinion-text/system-fonts"]
# `vello` also pulls the §5.37 self-hosted text engine (`pinion-text-font`):
# R1063 wires its `Coverage` AA-mask output into the Vello image path
# (`paint_adapter::coverage_to_image_data` / `draw_coverage`) — the first
# structural §5.37 → production-paint seam. Gated here because the conversion
# returns a `peniko::ImageData` (vello type) and lives in the vello-only
# paint_adapter module; non-GUI consumers never pull it.
# R1067 §5.37.11 — `vello` additionally pulls `pinion-platform-fonts`, the OS
# font-discovery layer that `text_engine::load_system_font` parses into a
# §5.37 `Font` (the production font source). Gated with `pinion-text-font`
# because the bridge's output type comes from that parser; a non-vello consumer
# never needs a production font.
vello = ["dep:vello", "dep:pinion-text-font", "dep:pinion-platform-fonts"]

[dependencies]
pinion-core = { path = "../pinion-core", version = "0.0.1" }
# R1550 — the decode-once image cache is LRU-bounded by BYTES (the arena had
# no bound at all before, and one 4K frame is 33 MB). Same crate the §5.36
# shape cache and `ResourceCache` already use; 3rd consumer.
lru = { workspace = true }
# §5.36 R47.4 text shaping primitive — backend-orthogonal: layout
# (compute_layout MeasureFunc) + paint (`paint_adapter::to_vello`'s
# Text arm) 양쪽이 같은 `LayoutCache` 인스턴스를 공유하여 shape work
# amortize. headless / TUI 도 intrinsic measure 가 필요하므로 default
# dep — vello feature gate 외부.
pinion-text = { path = "../pinion-text", version = "0.0.1", default-features = false }
# §5.21 R23/R24 layout system. Confined to pinion-runtime per the
# spec lock — pinion-core stays free of any layout-engine dep.
taffy = "0.7"
# R51.156 §5.23 — backs `BlockOnExecutor` (reference `Executor` impl
# in `command::executor`). `block_on` is a synchronous polling
# primitive (no IO reactor, no thread spawn, ~30 KiB compile cost), so
# pulling it as a regular dep does not promote pinion-runtime into an
# async runtime — the abstract `Executor` trait stays the contract,
# and production backends (`pinion-shell` / `pinion-tui` /
# `pinion-rpc`) still provide their own tokio / async-executor impls
# at the §6.3 boundary. `BlockOnExecutor` is the test fixture +
# CLI / embedded fallback the trait would otherwise force every
# consumer to re-implement.
futures-executor = "0.3"
# §5.16 R46.3.1 paint_adapter Scene → vello::Scene walker. Optional —
# only consumers building the Vello render path enable this feature.
# Workspace pin matches Vello's transitive wgpu version (see workspace
# Cargo.toml comment for the §5.16 R41 path C rationale).
vello = { workspace = true, optional = true }
# R740 §5.16 — backend-agnostic image decode for the vello-side image
# cache (`image_cache`, gated on `vello`). The decode lives in
# pinion-asset; this crate only converts a `DecodedImage`'s Arc-shared
# RGBA8 buffer into a `peniko::ImageData` at paint time.
pinion-asset = { path = "../pinion-asset", version = "0.0.1" }
# R1063 §5.37 → production-paint seam — the self-hosted text engine's
# `Coverage` AA mask is the input to `paint_adapter::coverage_to_image_data`.
# Optional + tied to the `vello` feature (the conversion targets a vello type),
# so non-GUI / TUI / headless-non-GPU consumers never pull it.
pinion-text-font = { path = "../pinion-text-font", version = "0.0.1", optional = true }
# R1067 §5.37.11 — OS system-font discovery (the platform layer that feeds the
# §5.37 in-memory font stack). `text_engine::load_system_font` discovers a
# system font's bytes here, then parses them with `pinion-text-font`. Optional +
# tied to the `vello` feature alongside the parser (a non-GUI consumer has no
# production-paint path to need a system font).
pinion-platform-fonts = { path = "../pinion-platform-fonts", version = "0.0.1", optional = true }

[dev-dependencies]
# R51.127 §5.41 — pull `pinion_core::test_fixtures::ButtonFixture` into
# the `core_shell` substrate test suite so the runtime + TUI crates
# share one canonical WidgetCore binding instead of two copies.
pinion-core = { path = "../pinion-core", version = "0.0.1", features = ["test-fixtures"] }
# R1079 §5.37 — `skrifa::metrics::Metrics` IS parley's line-metric source
# (parley/src/layout/data.rs shapes line boxes through it), so the
# `box_parity_matches_parley_metric_engine_via_skrifa` test uses it as the
# faithful cross-shaper oracle. Test-only; pinned to parley 0.9's skrifa so the
# oracle tracks the production shaper's exact metric selection.
skrifa = "0.42"

[lints]
workspace = true
