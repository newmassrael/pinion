[package]
name = "pinion-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Render loop and SCE hierarchical state machinery"

[features]
# Default = no GPU dep. `vello` enables the §5.16 R46.3.1 paint_adapter
# module — Scene → vello::Scene walk for the Vello render path. Kept
# behind a feature so non-GUI consumers (headless / TUI / future
# pinion-render-* alternatives) don't pull wgpu transitively.
default = []
vello = ["dep:vello"]

[dependencies]
pinion-core = { path = "../pinion-core", version = "0.0.1" }
# §5.36 R47.4 text shaping primitive — backend-orthogonal: layout
# (compute_layout MeasureFunc) + paint (`paint_adapter::to_vello`'s
# Text arm) 양쪽이 같은 `LayoutCache` 인스턴스를 공유하여 shape work
# amortize. headless / TUI 도 intrinsic measure 가 필요하므로 default
# dep — vello feature gate 외부.
pinion-text = { path = "../pinion-text", version = "0.0.1" }
# §5.37.4 R51.27 — UAX #9 BIDI substrate for the L4 mirroring pass.
# `paint_adapter::paint_text` calls `mirror_paired_brackets` on the
# TextNode content before handing it to parley so the shape input
# already carries mirrored glyphs at odd embedding levels. Default dep
# (no feature gate) — the helper is `Cow::Borrowed` fast-pathed for
# LTR / bracket-free content, so headless / TUI builds pay nothing.
pinion-text-unicode = { path = "../pinion-text-unicode", version = "0.0.1" }
# §5.21 R23/R24 layout system. Confined to pinion-runtime per the
# spec lock — pinion-core stays free of any layout-engine dep.
taffy = "0.7"
# §5.16 R46.3.1 paint_adapter Scene → vello::Scene walker. Optional —
# only consumers building the Vello render path enable this feature.
# Workspace pin matches Vello's transitive wgpu version (see workspace
# Cargo.toml comment for the §5.16 R41 path C rationale).
vello = { workspace = true, optional = true }

[lints]
workspace = true
