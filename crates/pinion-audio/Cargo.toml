[package]
name = "pinion-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "First-class introspectable engine audio (§5.54, R1274): PCM mixer + WAV decode + an audio graph queryable as scene-as-data, not an opaque External"
publish = false

[dependencies]
# The introspectable External surface (§2 #7 / §5.15) — the audio graph is
# queryable over RPC, NOT hidden behind an opaque handle.
pinion-core = { path = "../pinion-core", version = "0.0.1" }
# JSON-valued introspection of the voice graph.
serde = { workspace = true }
serde_json = { workspace = true }
# Compressed game-audio decode (OGG Vorbis / FLAC) per §5.54 (R1274): the
# canonical pure-Rust audio decoder, the same substrate kira/rodio build on
# ([[use-substrate-not-hand-rolled-equivalent]] — a Vorbis decoder is a real
# codec, not the trivial parse WAV is). Feature-gated to AUDIO-only formats:
# `default-features = false` drops symphonia's MP4/MKV video-container demuxers
# so we stay inside the §3 / §5.54 "audio-first-class, NOT multimedia stack"
# boundary. `ogg` = the OGG page reader (an *audio* container), `vorbis` = its
# codec, `flac` = the FLAC reader + codec.
symphonia = { version = "0.5", default-features = false, features = [
    "ogg",
    "vorbis",
    "flac",
] }
# Lock-free single-producer/single-consumer ring for the real-time command
# queue (control thread -> audio thread). The canonical realtime-safe SPSC
# ring the Rust audio ecosystem uses; pure Rust, no system deps
# ([[use-substrate-not-hand-rolled-equivalent]] — a hand-rolled lock-free ring
# is exactly the error-prone concurrency code to avoid).
rtrb = "0.3"
# The real audio-device backend (`cpal-backend` feature). cpal is the
# canonical cross-platform audio-I/O crate (rodio/kira build on it). Optional
# because its Linux backend links libasound (needs `libasound2-dev`); the core
# crate must build everywhere, so device output is opt-in.
cpal = { version = "0.15", optional = true }

[features]
# Real audio-device output via cpal (Linux: requires `libasound2-dev`).
cpal-backend = ["dep:cpal"]

# Device-output smoke check. `required-features` means `cargo build`/`clippy`
# (even `--all-targets`) SKIP it unless `cpal-backend` is on, so a checkout
# without the ALSA headers still builds the whole workspace.
[[example]]
name = "device_out"
required-features = ["cpal-backend"]

[lints]
workspace = true
