[package]
name = "pinion-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R51.109 §5.41 cell-based render mode primitive — ratatui Backend + crossterm event source, §2 #6 GUI/TUI dual invariant impl path (Scene → terminal cells, TUI sibling of the Vello pixel-raster pipeline)"

[lints]
workspace = true

# R51.178 §5.41 — expose `pinion_tui::test_fixtures` (TUI-side
# WidgetViewTui impl for the shared ButtonFixture / EchoButtonFixture
# reducer fixtures) to downstream `dev-dependencies` so the substrate
# test module reuses one canonical impl instead of repeating it
# inline across two test modules. Forwards `test-fixtures` into the
# supertrait crates (`pinion-core` for the types, `pinion-a11y` for
# the blank WidgetA11y impls) so the symbols surface at the same
# time the TUI-side impls compile. Mirrors the R51.175 pinion-shell
# precedent for end-to-end backend parity.
[features]
test-fixtures = ["pinion-core/test-fixtures", "pinion-a11y/test-fixtures"]

[dependencies]
# R1550 §5.7 §2 #6 — the process's resident set size, so `scene/memory`
# answers with the same shape on both backends.
pinion-platform-memory = { path = "../pinion-platform-memory", version = "0.0.1" }
# §5.41 R51.109.2 — `WidgetRenderer` trait lives in pinion-core so the
# TUI backend depends only on the lowest-level crate (no winit / wgpu
# transitive). pinion-shell stays the Vello-coupled binary path; this
# crate the ratatui-coupled binary path; both implement the same
# substrate trait.
pinion-core = { path = "../pinion-core", version = "0.0.1" }

# §5.41 R51.111 — abstract `Modifiers` vocabulary the substrate uses
# for input dispatch. pinion-runtime carries the winit-free
# `Modifiers` / `Touch` types (R51.108 lift) so the TUI crossterm
# bridge converts to the same shape the Vello shell's
# `winit_modifiers_to_pinion` helper produces. No transitive winit /
# wgpu — pinion-runtime is the §5.35 input + §5.36 layout substrate.
pinion-runtime = { path = "../pinion-runtime", version = "0.0.1" }

# §5.41 R51.111 — intent drain primitive (`walk_scene_and_drain`)
# shared with `pinion-shell::ShellCore`. The same scene-walk pulls
# §5.20 intents out of the `Scene::External` node after each input
# dispatch on both backends — different input sources, identical
# substrate path.

# §5.41 R51.118 — pinion-native AccessNode / AriaRole / AccessState
# surface. The TUI a11y substrate's first cut: `WidgetViewTui::
# access_node` default + per-binding overrides land the same
# semantic-tree contribution shape the Vello side already carries.
# AT integration (PTY screen reader path or future AccessKit-TUI)
# is carry-forward; this dep promotes the surface so the trait
# returns a concrete `Vec<AccessNode>` instead of an erased type.
pinion-a11y = { path = "../pinion-a11y", version = "0.0.1" }

# R668 §5.41 §5.49 — `DeferredInput` enum the substrate's
# `drain_deferred_inputs` consumes. RPC ingress wire (stdin reader +
# response writer + PreviewLedger / SceneRevision / FocusManager
# field lifts to ShellCoreTui) is a follow-up consumer of the
# substrate primitive landed here; this dep is the smallest surface
# that satisfies the §2 #6 GUI/TUI dual invariant for the AI-injected
# input arc (R666 character-key disc / R663 double-click / R660 drag
# / R664 focus_request). pinion-rpc has no winit / wgpu transitive,
# so the TUI binary stays terminal-only.
pinion-rpc = { path = "../pinion-rpc", version = "0.0.1" }

# §5.41 R51.109.0 — Rust TUI rendering library. Cell-based scene
# render target (§2 #6 GUI/TUI dual). Linebender-adjacent maintainer
# continuity; egui / iced / bubbletea-class adoption baseline. The
# Scene → ratatui buffer mapping lands in pinion-runtime
# `paint_adapter::to_tui` behind the `tui` feature (R51.109.1+); the
# actual `TuiRenderer: WidgetRenderer` impl lives here (R51.109.2+).
ratatui = { workspace = true }

# §5.41 R51.109.0 — terminal capability detection, raw mode, mouse +
# key event source. Already a transitive ratatui dep; promoted to
# direct so this crate can reach `crossterm::event::Event` /
# `KeyEvent` / `MouseEvent` types without going through ratatui's
# re-export.
crossterm = { workspace = true }

# §5.41 R51.110.0 — Unicode grapheme cluster iteration for the
# Scene → ratatui::Buffer paint walker. The `TextNode.content` field
# carries arbitrary UTF-8 (CJK, emoji, combining marks), and TUI
# cells are grapheme-cluster-sized — splitting on raw `char`
# boundaries would mis-render combining sequences. Already a
# transitive ratatui / parley dep; promoted to direct so pinion-tui
# does not implicit-depend through the re-export chain.
unicode-segmentation = "1.12"

# §5.41 R51.110.0 — Unicode East Asian Width property for the
# Scene → ratatui::Buffer paint walker. Wide graphemes (CJK,
# fullwidth Latin, some emoji) consume two terminal cells; narrow
# graphemes consume one. The paint walker must advance the column
# cursor by the actual cell-width to avoid overlapping placement.
unicode-width = "0.2"

# R1344 §5.41 §5.37.7 — the UAX #14 line breaker the cell text layout
# (`crate::text_layout`) wraps against. Break opportunities are a
# property of the text, not the font, so the cell backend reuses the
# SAME breaker the Vello backend does and supplies only a cell-width
# measure closure. This crate carries ZERO external dependencies
# (pure Unicode tables), so the TUI gains no font / parley / wgpu
# weight from it — the shaping half stays in pinion-text-font, which
# pinion-tui does not depend on.
pinion-text-unicode = { path = "../pinion-text-unicode", version = "0.0.1" }

# R51.160 §5.23 — tokio multi-thread runtime backs the TUI shell's
# concrete `Executor` impl, sibling of `pinion_shell::TokioExecutor`.
# Per-backend duplication is intentional at this round: each shell
# crate owns its async runtime binding so neither pulls the other's
# winit / wgpu / ratatui transitive deps. A future DRY extraction
# (e.g. `pinion-async` crate) lifts the shared impl once a third
# backend (mobile / RPC-only) lands.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
# R51.127 §5.41 — pull `pinion_core::test_fixtures::ButtonFixture` into
# the `ShellCoreTui` substrate test suite so the TUI + runtime crates
# share one canonical WidgetCore binding instead of two copies.
pinion-core = { path = "../pinion-core", version = "0.0.1", features = ["test-fixtures"] }
# R51.127 §5.40 — pull pinion-a11y's atomic-default `WidgetA11y` impl
# for `ButtonFixture` so the test module's `WidgetViewTui` impl
# resolves the supertrait chain without an orphan-rule violation.
pinion-a11y = { path = "../pinion-a11y", version = "0.0.1", features = ["test-fixtures"] }
# R51.178 §5.41 — self path-dep so the substrate test module picks up
# `pinion_tui::test_fixtures` (the cfg-gated TUI-side WidgetViewTui
# impls for ButtonFixture + EchoButtonFixture). Mirrors the
# R51.175 pinion-shell precedent; production builds stay
# feature-free, the dev build adds the fixture module.
pinion-tui = { path = ".", features = ["test-fixtures"] }
