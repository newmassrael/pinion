[package]
name = "pinion-node-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1577 Phase-B node-graph substrate: the MECHANISM of a DCC/visual script-class node system, with the taxonomy left to the application. A typed socket model whose structural edits maintain their own invariants (type agreement, one link per input, in-tree acyclicity), re-usable group DEFINITIONS with an interface DERIVED from the selection boundary, instances, nesting acyclicity, an edit path, and a memoised evaluator that descends into groups and keys its memo by instance so two instances of one definition do not share a value. Pure data: no renderer, no reactive runtime, no window."
publish = false

[dependencies]
pinion-graph = { path = "../pinion-graph", version = "0.0.1" }
# R1630 — `#[derive(VariantCensus)]`: the compile-time check that a
# hand-written `ALL` vocabulary list still has one entry per variant.
pinion-derive = { path = "../pinion-derive" }
# A node system saves its document, and a `Signal<T>` payload must be
# serializable, so the model derives serde rather than leaving every consumer to
# mirror it.
serde = { workspace = true }
# R1689 — `Archive` picks a concrete text form rather than leaving it open, and
# picks JSON: the envelope is parsed in two independent steps (document, then
# the application's companion) so one failing does not take the other, which a
# format-agnostic `Serializer` cannot express. It is also the form §2 #7 asks
# for — a saved graph an agent can read without the process that wrote it. No
# `serde_json` type appears in the public API.
serde_json = { workspace = true }

[lints]
workspace = true
