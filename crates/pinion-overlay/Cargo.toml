[package]
name = "pinion-overlay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "AI overlay UX layer — event capture + scene highlight injection per §5.33"

[lints]
workspace = true

[dependencies]
# Scene primitives + Rect; pinion-overlay transforms Scene values directly.
pinion-core = { path = "../pinion-core", version = "0.0.1" }
# Path string parsing for highlight targeting reuses scene/locate helpers.
pinion-rpc = { path = "../pinion-rpc", version = "0.0.1" }
# R1363 §5.55 — `WindowControl` lives beside `DEFAULT_WINDOW` in the crate that
# owns window identity; `chrome_tag_semantic` names it to keep R1190's
# tag-to-semantic map whole. Acyclic: overlay already reaches runtime via pinion-rpc.
pinion-runtime = { path = "../pinion-runtime", version = "0.0.1" }
