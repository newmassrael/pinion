[package]
name = "pinion-chart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1354 Phase-B dataviz substrate — retained-mode charting: a value->pixel LinearScale, nice-number axis ticks, a colourblind-aware categorical series palette, and a LineChart/AreaChart builder that emits a pinion_core::Scene (axes, gridlines, tick labels, series polylines, legend) from Scene::Path + Scene::Text. Pure scene-as-data (inv #1/#7): every element is tagged and introspectable, no rasterizer / GPU. The missing-library half of the charting gap — the drawing primitive (Scene::Path, R721) already existed."
publish = false

[lints]
workspace = true

[dependencies]
# The structured scene + style the chart projects into. Pure: no GPU /
# vello / winit. A leaf peer of pinion-pdf and pinion-widget-paint — each
# walks / builds the same tree in pinion-core's coordinate system
# (Rect u32, Color sRGB u8, PathCommand f32 sub-pixel).
pinion-core = { path = "../pinion-core", version = "0.0.1" }
# R1630 — `#[derive(VariantCensus)]`: the compile-time check that a
# hand-written `ALL` vocabulary list still has one entry per variant.
pinion-derive = { path = "../pinion-derive" }
# R1634 — a chart answers its own AT tree (`access_table`). Pure data like
# this crate: pinion-a11y depends on pinion-core and nothing else, so the
# leaf-peer posture is unchanged and no cycle is possible.
pinion-a11y = { path = "../pinion-a11y", version = "0.0.1" }

[dev-dependencies]
# R1360 — TEST-ONLY. `build_fill` is layout-native: its root fills its slot
# and its children are parent-relative. Proving that end-to-end needs the
# taffy pass (`compute_layout`), which lives in pinion-runtime. The crate's
# public API stays runtime-free (no cycle: runtime never deps chart); this
# edge exists only so the layout mechanic is pinned next to the code it proves.
pinion-runtime = { path = "../pinion-runtime", version = "0.0.1" }
pinion-text = { path = "../pinion-text", version = "0.0.1" }
