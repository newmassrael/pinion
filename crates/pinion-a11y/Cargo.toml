[package]
name = "pinion-a11y"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R51.61 §5.40 — AccessKit-backed accessibility substrate. Stable pinion-native AccessNode / AriaRole / AccessAction surface wrapping accesskit::Node / Role / Action so WidgetView trait + per-widget mappings depend on a single upgrade boundary (accesskit_winit Adapter coupling lives in pinion-shell)."

[lints]
workspace = true

[features]
default = []
# R51.127 §5.40 — forward pinion-core's `test-fixtures` so the
# `WidgetA11y` blanket-default impl for `ButtonFixture` is exposed
# alongside the WidgetCore impl. pinion-tui's substrate tests pull
# both crates' `test-fixtures` features in tandem so the empty-body
# a11y impl satisfies the WidgetViewTui supertrait chain without
# orphan-rule violation in the downstream test module.
test-fixtures = ["pinion-core/test-fixtures"]

[dependencies]
# pinion-native Rect (u32) source that AccessTreeBuilder converts to
# accesskit::Rect (f64) at build time. Reused so the public WidgetView
# surface stays in pinion-core's coordinate system.
pinion-core = { path = "../pinion-core", version = "0.0.1" }

# §5.40 substrate. The crate wraps every accesskit:: type that escapes
# into the public surface so a future accesskit bump (0.24 → 0.25 → …)
# rewrites only this crate's bodies, not WidgetView impls.
accesskit = { workspace = true }
