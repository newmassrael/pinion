[package]
name = "pinion-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# R1659 — can the text stack DISCOVER the fonts installed on this machine?
#
# On by default, so pinion's own bindings and every existing consumer are
# unchanged. Off is for a consumer that reaches this crate without ever asking
# it to shape anything against a system font — the JSON-RPC-only case — and
# what it buys is not speed but a BUILD: parley's `system` feature forwards to
# `fontique/system`, which on Linux makes the fontconfig development headers a
# requirement of everything downstream.
#
# It gates a font SOURCE, not an API. Every type and every method here exists
# and compiles either way; with the source off the stack shapes against the
# fonts it was GIVEN (`LayoutCache::with_own_fonts`, R1573) and finds none it
# was not. That is why this is a dependency switch rather than a `cfg` over the
# surfaces that measure text.
default = ["system-fonts"]
system-fonts = ["parley/system"]

[dependencies]
pinion-core = { path = "../pinion-core" }
# §5.37.4 R51.31 — UAX #9 BIDI substrate for the L4 mirroring pass.
# `LayoutCache::shape` calls `mirror_paired_brackets` on the raw text
# before handing it to parley so the cache key (raw text) maps to a
# Layout whose shape input is the post-mirror string. Single-cache
# lookup covers mirror + shape; paint_adapter sees `cache.layout(raw)`
# and never invokes the BIDI helper directly. `Cow::Borrowed` fast
# path keeps LTR / bracket-free content allocation-free.
pinion-text-unicode = { path = "../pinion-text-unicode" }
parley = { workspace = true }
# R1448 §5.36 §5.16 — the font-source probe recovers from an upstream fontique
# `unwrap` and must say so on a real log level, not via `eprintln`
# ([[verify-via-tracing-not-eprintln]]); the workspace logging substrate.
tracing = { workspace = true }
swash = { workspace = true }
lru = { workspace = true }

[lints]
workspace = true
