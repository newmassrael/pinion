[package]
name = "pinion-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "JSON-RPC 2.0 server with typed-hybrid method shape"

[dependencies]
pinion-core = { path = "../pinion-core", version = "0.0.1" }
# R1630 — `#[derive(VariantCensus)]`: the compile-time check that a
# hand-written `ALL` vocabulary list still has one entry per variant.
pinion-derive = { path = "../pinion-derive" }
pinion-runtime = { path = "../pinion-runtime", version = "0.0.1" }
# R979 §5.40 §2 #7 — `scene/access` serializes the WAI-ARIA `AccessNode`
# tree (built by `pinion-a11y`) so the AI-first JSON-RPC path can
# introspect the accessibility projection a screen reader receives.
pinion-a11y = { path = "../pinion-a11y", version = "0.0.1" }
# R908 §5.53 — Scene -> PDF renderer for the `scene/export_pdf` method.
pinion-pdf = { path = "../pinion-pdf", version = "0.0.1" }
# R1546 §5.36 §5.12 — `scene/text_backgrounds` answers where a run's declared
# background was PAINTED, which only the shaped layout knows. Direct rather
# than through `pinion-runtime`'s `LayoutCache` re-export: the module names
# `TextBackground` too, and a dep that is used should be declared.
pinion-text = { path = "../pinion-text", version = "0.0.1" }
pinion-text-font = { path = "../pinion-text-font", version = "0.0.1" }
pinion-text-unicode = { path = "../pinion-text-unicode", version = "0.0.1" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# R633 §5.7 §5.22 — activate `pinion-core::test_fixtures::BindableCacheSlot`
# for the per-axis test sibling files. Cargo unifies the dep with
# the regular `[dependencies]` entry above; the `test-fixtures`
# feature is only active for test/bench builds, never in production.
pinion-core = { path = "../pinion-core", version = "0.0.1", features = ["test-fixtures"] }

# R1345 §5.21 — pins the invariant `ViewBlueprint`'s bare rects rest on: that
# `ReplaceView` targets the state scene, which is never laid out. The test lays
# a materialised blueprint out on purpose to prove the rects would die if that
# ever changed. Dev-only: the wire surface itself stays layout-free.
pinion-runtime = { path = "../pinion-runtime", version = "0.0.1" }

[lints]
workspace = true
