[package]
name = "pinion-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "JSON-RPC 2.0 server with typed-hybrid method shape"

[dependencies]
pinion-core = { path = "../pinion-core", version = "0.0.1" }
pinion-runtime = { path = "../pinion-runtime", version = "0.0.1" }
# R979 §5.40 §2 #7 — `scene/access` serializes the WAI-ARIA `AccessNode`
# tree (built by `pinion-a11y`) so the AI-first JSON-RPC path can
# introspect the accessibility projection a screen reader receives.
pinion-a11y = { path = "../pinion-a11y", version = "0.0.1" }
# R908 §5.53 — Scene -> PDF renderer for the `scene/export_pdf` method.
pinion-pdf = { path = "../pinion-pdf", version = "0.0.1" }
pinion-text-font = { path = "../pinion-text-font", version = "0.0.1" }
pinion-text-unicode = { path = "../pinion-text-unicode", version = "0.0.1" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# R633 §5.7 §5.22 — activate `pinion-core::test_fixtures::BindableCacheSlot`
# for the per-axis test sibling files. Cargo unifies the dep with
# the regular `[dependencies]` entry above; the `test-fixtures`
# feature is only active for test/bench builds, never in production.
pinion-core = { path = "../pinion-core", version = "0.0.1", features = ["test-fixtures"] }

[lints]
workspace = true
