[package]
name = "pinion-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Core scene primitives, Style trait, and view-fn types"

[lints]
workspace = true

[features]
default = []
# R51.127 §5.41 — expose `pinion_core::test_fixtures` (ButtonFixture
# substrate-level binding) to downstream `dev-dependencies` so the
# `pinion-runtime` + `pinion-tui` test suites share one canonical
# fixture instead of two near-identical copies. Never enabled by
# production consumers.
test-fixtures = []

[dependencies]
# R1053 §5.4 PR-22 — git+rev via workspace dep (was a `vendor/sce` path dep).
# `default-features = false` lives on the workspace declaration: a member-side
# override is silently ignored by Cargo when `workspace = true`.
sce-rust-runtime = { workspace = true }
# SCE-002 — `#[derive(WidgetStateName)]` / `#[derive(WidgetEventName)]` are
# injected onto the sce-generated widget enums (compiled into this lib) via
# `build.rs`'s `compile_scxml_with_derives`. `pinion-derive` dev-deps
# `pinion-core`, not the reverse, so this normal dep introduces no cycle.
pinion-derive = { path = "../pinion-derive" }
serde = { workspace = true }
serde_json = { workspace = true }
# R934 §5.22 — `ResourceCache::with_capacity` backs an LRU-bounded async
# slice cache for truly unbounded sources (million-row asset stores). Same
# `lru` crate the `pinion-text` LayoutCache already uses (2nd crate consumer).
lru = { workspace = true }

[build-dependencies]
# R1053 §5.4 PR-22 — git+rev via workspace dep (was a `vendor/sce` path dep).
sce-build = { workspace = true }

[dev-dependencies]
# R51.105 §5.38 — criterion micro-bench measuring ListBox dispatch
# alloc cost (Snapshot=Vec<bool> per user input). Drives the data-
# driven SmallVec-vs-Vec decision for R51.102's substrate refactor.
criterion = { workspace = true }
# R1718 — this crate's own INTEGRATION tests link the lib built without
# `cfg(test)`, so `test_fixtures` needs the feature turned on for them the way
# any downstream consumer does. Measured, and worth the line: without it
# `cargo test -p pinion-core` fails to compile the speech census while
# `cargo test -p pinion-core -p pinion-rpc` passes, because the sibling's own
# dev-dependency turns the feature on for the shared build. A gate that is
# only there when another crate happens to be in the same invocation is a gate
# that is not there.
pinion-core = { path = ".", features = ["test-fixtures"] }

[[bench]]
name = "listbox_dispatch"
harness = false
