[package]
name = "pinion-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Core scene primitives, Style trait, and view-fn types"

[lints]
workspace = true

[features]
default = []
# R51.127 §5.41 — expose `pinion_core::test_fixtures` (ButtonFixture
# substrate-level binding) to downstream `dev-dependencies` so the
# `pinion-runtime` + `pinion-tui` test suites share one canonical
# fixture instead of two near-identical copies. Never enabled by
# production consumers.
test-fixtures = []

[dependencies]
# R1053 §5.4 PR-22 — git+rev via workspace dep (was a `vendor/sce` path dep).
# `default-features = false` lives on the workspace declaration: a member-side
# override is silently ignored by Cargo when `workspace = true`.
sce-rust-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# R934 §5.22 — `ResourceCache::with_capacity` backs an LRU-bounded async
# slice cache for truly unbounded sources (million-row asset stores). Same
# `lru` crate the `pinion-text` LayoutCache already uses (2nd crate consumer).
lru = { workspace = true }

[build-dependencies]
# R1053 §5.4 PR-22 — git+rev via workspace dep (was a `vendor/sce` path dep).
sce-build = { workspace = true }

[dev-dependencies]
# R51.105 §5.38 — criterion micro-bench measuring ListBox dispatch
# alloc cost (Snapshot=Vec<bool> per user input). Drives the data-
# driven SmallVec-vs-Vec decision for R51.102's substrate refactor.
criterion = { workspace = true }

[[bench]]
name = "listbox_dispatch"
harness = false
