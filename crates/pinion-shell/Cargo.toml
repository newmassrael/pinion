[package]
name = "pinion-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R51.30 §5.16/§5.20/§5.35 paint-side AppShell — winit lifecycle + Vello render loop + JSON-RPC stdin reader + InputRouter/IntentQueue/LayoutCache wiring, generic over WidgetView (one binary = one widget catalogue entry)"

# Lib-only (no [[bin]]) — consumers are example binaries / future
# application crates that pull `pinion_shell::run::<V>()` from their
# own `fn main()`.

[dependencies]
pinion-core = { path = "../pinion-core", version = "0.0.1" }
# §5.16 paint_adapter Scene -> vello::Scene walk + InputRouter + IntentQueue
# + compute_layout — all of AppShell's substrate calls live in pinion-runtime
# (vello feature for the paint_adapter half).
pinion-runtime = { path = "../pinion-runtime", version = "0.0.1", features = ["vello"] }
# §5.12 bidirectional RPC dispatcher — every winit/RPC frame routes through
# `dispatch` + `DispatchContext` here, never bypassed.
pinion-rpc = { path = "../pinion-rpc", version = "0.0.1" }
# §5.39 focus-ring overlay — `inject_focus_ring` injects the keyboard
# focus ring as an introspectable pointer-transparent Scene::Box (R705),
# applied as the final step of every paint-scene producer.
pinion-overlay = { path = "../pinion-overlay", version = "0.0.1" }
# §5.36 text shaping primitive — owned `LayoutCache` shared between
# `compute_layout` (measure) and `paint_adapter::to_vello` (paint).
pinion-text = { path = "../pinion-text", version = "0.0.1" }
# §4 first dogfood window lifecycle — winit's ApplicationHandler is the
# entry point AppShell implements. Workspace-pinned to keep examples /
# shell in lock-step.
winit = { workspace = true }
# §5.16 R46.5 Vello backend (paint scene submission + peniko Color for
# `RenderParams.base_color`). AppShell is Vello-only by design — TUI /
# headless paths go through a different shell (or no shell at all).
vello = { workspace = true }
# Block on Vello's async `RenderContext::create_surface` at app boot.
# pinion-core / runtime / shell logic is sync (§6.3); pollster wraps
# the one-shot init future at the boundary so view-fn purity stays
# intact across all consumers.
pollster = { workspace = true }
# R51.61 §5.40 — pinion-native AccessKit wrapper. AppShell owns the
# `accesskit_winit::Adapter` and lowers `AccessNode`s emitted by
# `WidgetView::access_node` into `TreeUpdate` via `AccessTreeBuilder`.
pinion-a11y = { path = "../pinion-a11y", version = "0.0.1" }
# R51.62 §5.40 — winit-coupled AccessKit Adapter. Lives only in
# pinion-shell because the Adapter type is per-Window per-EventLoop;
# pinion-a11y stays winit-free so headless / TUI shells can reuse the
# substrate.
accesskit = { workspace = true }
accesskit_winit = { workspace = true }
# R51.159 §5.23 — tokio multi-thread runtime backs the [`TokioExecutor`]
# concrete [`Executor`] impl in `crate::executor`. The substrate
# [`CommandExecutor`] in pinion-runtime stays runtime-agnostic; the
# binding to tokio lives at the §6.3 boundary (here, paint-side
# shell). `rt-multi-thread` is the worker-thread builder + `rt` is
# the base runtime + `macros` enables `#[tokio::test]` for unit
# tests. We pin the default-features off `tokio` (no need for net/fs
# at this round) but enable everything via `enable_all` per-runtime.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
# R670.B §5.16 — JSON-RPC frame `{window: "<id>"}` sniffer needs to
# parse the frame just enough to extract the window scope before
# threading it into the substrate paint producer. `serde_json` is
# already a transitive dep (pinion-rpc pulls it for the dispatch
# parse); promoted to direct here for the `parse_rpc_window_id`
# helper in app.rs.
serde_json = { workspace = true }
# R683 §5.16 §5.41 — `WindowSpec` / `SizeStrategy` derive
# `Serialize + Deserialize` so `Signal<Vec<WindowSpec>>` (the runtime
# window-list lift the dock + tear-off arc R683 introduces) satisfies
# the `pinion_core::Signal<T>` trait bound
# `T: Clone + PartialEq + Serialize + DeserializeOwned + 'static`.
# Direct dep (not just transitive through pinion-core) so the
# `#[derive]` macros expand against `serde::Serialize` /
# `serde::Deserialize` at this crate's import scope.
serde = { workspace = true }
# R637 §5.16 §5.7 — PNG encoder for `headless_screenshot::HeadlessScreenshot::render_to_png`.
# `png` crate is the encode-only path (decode + diff lives in
# pinion-cli R638+); the dep is single-purpose so this crate stays
# in the substrate role without adopting the broader `image` umbrella.
png = { workspace = true }

# R51.175 §5.41 — expose `pinion_shell::test_fixtures` (Vello-side
# WidgetView impl for the shared `EchoButtonFixture` reducer fixture)
# to downstream `dev-dependencies` so the integration test suite
# reuses the canonical reducer fixture instead of an ad-hoc
# `TestView` mock. Forwards `test-fixtures` into the supertrait
# crates (`pinion-core` for the type, `pinion-a11y` for the blank
# `WidgetA11y` impl) so the symbol surfaces at the same time the
# Vello-side impl compiles.
[features]
test-fixtures = ["pinion-core/test-fixtures", "pinion-a11y/test-fixtures"]

[dev-dependencies]
# R51.159 §5.23 — `tokio::time::sleep` etc. for command-dispatch
# integration tests that need a real async boundary. Same feature set
# as the runtime dep so the test crate compiles without extra knobs.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
# R51.175 §5.41 — self path-dep so the integration test suite picks
# up `pinion_shell::test_fixtures` (gated behind the local
# `test-fixtures` feature, forwarded into the supertrait crates).
# Cargo accepts a self-`path = "."` dev-dep; the production
# build of this crate stays feature-free, the dev build adds the
# fixture module.
pinion-shell = { path = ".", features = ["test-fixtures"] }
# R706.1 §5.16 §5.39 — the headless focus-ring regression test
# (`headless_screenshot::tests`) builds the REAL `view_datepicker` paint
# scene so it reproduces the fragment-cache direct-draw-after-append
# offset against the production grid nesting. No dependency cycle:
# pinion-widget-paint depends only on core/text/a11y, all below shell.
pinion-widget-paint = { path = "../pinion-widget-paint", version = "0.0.1" }

[lints]
workspace = true
