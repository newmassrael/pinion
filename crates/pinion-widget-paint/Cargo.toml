[package]
name = "pinion-widget-paint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R657 §5.16 §5.38 — backend-agnostic per-widget paint composition helpers. Sits between pinion-core (Scene primitives + Style + Theme + widget statecharts) and the per-backend shells (pinion-shell GUI / pinion-tui TUI), so both backends consume one source of truth for widget visual rendering. First consumer (R657) is TextField — surfacing the ~280 LOC of caret/selection/preedit composition that hello-textfield + todomvc previously duplicated. Future axes extend with toggle.rs / slider.rs / etc. as 2nd-consumer signals fire per [[abstraction-needs-second-consumer]]."

[dependencies]
# R657 §5.16 — Scene + Style + Theme + ColorRole + widget statechart
# enums (TextFieldState). The crate is foundational atoms only; the
# widget paint composition helpers compose those atoms.
pinion-core = { path = "../pinion-core" }
# R657 §5.16 R56.1.b.2 §5.36 — LayoutCache + caret_rect_for_byte_offset.
# The substrate this crate's helpers wrap into widget-shape Scene
# fragments (TextField caret, selection band, preedit underline all
# resolve through these primitives).
pinion-text = { path = "../pinion-text" }
# R657 §5.16 §5.40 — AriaRole + AccessNode for a11y carriage. The
# widget paint helpers produce Scene with the right `with_aria_label`
# overrides so the a11y enrich pass downstream wires them.
pinion-a11y = { path = "../pinion-a11y" }
# (R685 §5.16 §5.49) `DockTopology` + `DockNode` + `DockSlot` +
# `SplitterOrientation` derive `Serialize + Deserialize` so the dock
# topology tree round-trips through JSON for AI-introspection
# (mirror of `pinion-shell::WindowSpec` serde derive R683.A
# established). Pulled in at the crate level rather than feature-
# gated because the topology API surface always exposes serde-shaped
# data — making serde optional would surface a per-binding compile
# choice the substrate cannot resolve without a 2nd-consumer signal.
serde = { workspace = true }
# (R685 §5.16) `serde_json` is dev-only here — topology JSON round-
# trip tests need it to assert the bit-stable on-disk form. Production
# bindings serialize through their own pipelines (pinion-platform-
# storage or the binding's chosen format); the substrate stays
# format-agnostic.

[dev-dependencies]
# (R684 §5.21 §5.16) Test-only dependency on pinion-runtime so the
# dock + splitter substrate tests can drive a real `compute_layout`
# pass over their assembled scenes (the only way to pin "header
# stretches to full panel width" and "splitter ratio maps to actual
# rect widths" without re-implementing taffy here). pinion-runtime
# default features stay off so the vello GPU stack does not pull
# into the test binary.
pinion-runtime = { path = "../pinion-runtime" }
# (R685 §5.16 §5.49) `serde_json` for `DockTopology` JSON round-trip
# tests in `dock::topology::tests`. Dev-only — production bindings
# serialize through their own pipelines (pinion-platform-storage or
# the binding's chosen format).
serde_json = { workspace = true }

[lints]
workspace = true
