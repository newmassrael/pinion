[toolchain]
# R46.3 §5.16 — Vello 0.6 requires rustc 1.86 (released 2025-04). The
# workspace tracks the lowest rustc that compiles every dep transitively
# rather than the freshest stable, so consumers building from source on
# slow-moving distros stay supported. Bumping past 1.86 needs a similar
# trigger from a workspace dep, not a CI freshness preference.
channel = "1.86.0"
components = ["rustfmt", "clippy"]
