[toolchain]
# R47.1 §5.36 — parley 0.9 (+ fontique 0.9 / parley_data 0.9 / parlance
# 0.1) requires rustc 1.88 (released 2025-06). Pre-R47 baseline was 1.86
# (R46.3 Vello 0.6 transitive bump). The workspace tracks the lowest
# rustc that compiles every dep transitively rather than the freshest
# stable, so consumers building from source on slow-moving distros stay
# supported. Bumping past 1.88 needs a similar trigger from a workspace
# dep, not a CI freshness preference.
channel = "1.88.0"
components = ["rustfmt", "clippy"]
