[package]
name = "hello-virtual-select"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R746 §5.27 selectable virtualized list consumer: a 10,000-row list where single-select is held by data index (VirtualSelectExternal), decoupled from materialization, so selecting a row and scrolling far away preserves it; click-to-select over the windowed rows + aria-selected on the rendered ListItem."
publish = false

[[bin]]
name = "hello-virtual-select"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R744 §5.27 — `view_virtual_list` windowed-list assembly + the
# `view_vertical_scrollbar` peer (R659 lift).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
