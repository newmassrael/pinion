[package]
name = "hello-raw-pointer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1416 §5.35 §5.15 — a raw multi-button pointer sink. A widget that opts into External::wants_raw_pointer_buttons receives every mouse button (left/middle/right) on both the press AND release edge, each with the held modifiers and the button identified, via the typed raw_pointer_button seam — while every non-raw widget keeps the standard per-button GUI semantics (left=focus, middle=paste, right=context menu). The forcing consumer for the sprag PR-72 pointer-capture gap: a pane oracle needs faithful press+release of all three buttons with modifiers to forward xterm mouse reports."
publish = false

[[bin]]
name = "hello-raw-pointer"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
