[package]
name = "hello-dock-panels-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R685 §5.16 §5.41 §5.49 — 2nd dock consumer triggering Rule-of-Three substrate lift. 5-pane editor topology (toolbar + outliner + viewport + properties + console) composed via `pinion_widget_paint::dock::view_dock_surface` recursive walker over a declarative `DockTopology`. Mirror of every DCC / IDE shell (VSCode / IntelliJ / Photoshop / Unreal Editor) layout. Pairs with `hello-dock-panels` (1st consumer R683.C) to validate the R685 topology composition substrate."
publish = false

[[bin]]
name = "hello-dock-panels-editor"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[dev-dependencies]
# (R685 §5.16) `serde_json` for `DockTopology` round-trip tests +
# topology JSON-shape assertions. Dev-only — production view fn
# stays format-agnostic.
serde_json = { workspace = true }

[lints]
workspace = true
