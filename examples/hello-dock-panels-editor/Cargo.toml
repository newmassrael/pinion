[package]
name = "hello-dock-panels-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R685 §5.16 §5.41 §5.49 — 2nd dock consumer triggering Rule-of-Three substrate lift. 5-pane editor topology (toolbar + outliner + viewport + properties + console) composed via `pinion_widget_paint::dock::view_dock_surface` recursive walker over a declarative `DockTopology`. Mirror of every DCC / IDE shell (the code editor / IntelliJ / the raster editor / the engine Editor) layout. Pairs with `hello-dock-panels` (1st consumer R683.C) to validate the R685 topology composition substrate."
publish = false

[[bin]]
name = "hello-dock-panels-editor"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }
# (R1105 §5.51 PR-31) `serde_json` reads the cross-window tear-off
# (`tear_off_follow` / `tear_off_redock_at`) intent payloads in the reducer —
# promoted from dev-only when the float-to-window arm landed. Also serves the
# `DockTopology` round-trip + JSON-shape tests.
serde_json = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
