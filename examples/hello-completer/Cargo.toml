[package]
name = "hello-completer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1449 §5.27 §5.38 §5.40 completer attached to a plain text input — Qt QCompleter parity (filter mode x case sensitivity x popup/unfiltered-popup/inline completion) over the pinion_core::widgets::completion model, with the whole completion readable and drivable as scene-as-data"
publish = false

[[bin]]
name = "hello-completer"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# R51.64 §5.40 — AccessKit substrate for `WidgetA11y::access_node`.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1449 §5.50 — dismiss_barrier + text-field / listbox / popup / toolbar paint.
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
