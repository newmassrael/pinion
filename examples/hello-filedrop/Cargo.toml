[package]
name = "hello-filedrop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R770 §5.15 OS file drag-drop consumer — drag a file from the OS file manager onto the window; the drop-zone highlights while hovering and lists dropped paths. Demonstrates the WidgetView file hooks (on_file_hover / on_file_hover_cancel / on_file_drop) + the scene/hover_file / scene/drop_file RPC peers"
publish = false

[[bin]]
name = "hello-filedrop"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
