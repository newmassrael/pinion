[package]
name = "hello-grouped-grid-sort"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R846 §5.27 §5.40 sortable grouped data grid (the asset table): clickable column headers sort 10,000 rows via a GridSortState (R778); the sorted order feeds GroupOrderState::with_order_source (the 2nd consumer of the R844 order-source, grid sort proxy vs list), so rows sort WITHIN their asset-type groups; collapsible group headers + row selection coexist. WAI-ARIA grid with aria-sort."
publish = false

[[bin]]
name = "hello-grouped-grid-sort"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
