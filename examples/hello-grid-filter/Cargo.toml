[package]
name = "hello-grid-filter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R783 §5.40 data-grid filter at scale: a 10,000-row virtualized data-grid whose AI-first column filter (invoke set_filter \"<col>=<value>\") shrinks the view, composing with clickable numeric-aware sort headers and data-indexed selection. Adds the GridSortState filter axis (peer of the 1-D ViewOrderState filter); no new windowing substrate."
publish = false

[[bin]]
name = "hello-grid-filter"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
