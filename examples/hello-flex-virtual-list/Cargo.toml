[package]
name = "hello-flex-virtual-list"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R774 §5.27 flex-viewport (AutoSizer) virtualization: a 10,000-row list whose ScrollNode flex-grows to fill the window, windowing against the runtime-measured viewport height instead of a const; resize the window and the rendered row count follows. react-window AutoSizer pattern over the existing R744 windowing substrate."
publish = false

[[bin]]
name = "hello-flex-virtual-list"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R774 §5.27 — `view_flex_virtual_list` AutoSizer assembly + the
# `view_vertical_scrollbar` peer.
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
