[package]
name = "hello-grid-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1004 §5.27 §5.40 search-and-jump cursor at scale: a 10,000-row virtualized data-grid where a GridFilter query drives a match cursor (next/prev/jump) that scrolls each match into view, every row staying visible. Reuses the R997 GridFilter predicate (search is its 3rd consumer after filter+coloring), reveal_row for the jump, and the R998 row_style hook to highlight matches. AI-first invoke set_query/next/prev/jump."
publish = false

[[bin]]
name = "hello-grid-search"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
