[package]
name = "hello-boxplot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1553 box-plot consumer — the forcing consumer for pinion-chart's Distribution, the crate's first datum that is not a point (Qt QBoxPlotSeries). Five endpoints' raw latency samples are summarised HERE rather than upstream, so the quantile definition is a runtime choice whose three standard answers visibly disagree, the whiskers stop at Tukey's 1.5*IQR fence with every sample beyond it drawn as its own mark, and the notch is available because the sample count survived the summary. Qt's QBoxSet is five doubles: it computes none of them, cannot draw an outlier, and does not carry the n a notch needs."
publish = false

[lints]
workspace = true

[dependencies]
# R1553 — the distribution datum and the box plot under test.
pinion-chart = { path = "../../crates/pinion-chart", version = "0.0.1" }
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# §5.40 AccessKit substrate for the radiogroup + toggle-button a11y nodes.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through pinion-gpu.
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
# The shared chip skin the method radio and the two option toggles wear.
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
# Build-time codegen for the `HelloBoxPlotRenderer` Vello wrapper.
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }
