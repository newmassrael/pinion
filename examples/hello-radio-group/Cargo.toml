[package]
name = "hello-radio-group"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R51.44 §5.38 composite hit-target first-client: N=3 Radio group via paint 'main_group#0..2' tags + state RadioGroupExternal — substrate-first 3-round (R51.41 RFC + R51.42 InputRouter '#' split + R51.43 introspect per-radio) end-to-end visual evidence"
publish = false

[[bin]]
name = "hello-radio-group"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# R51.66 §5.40 — AccessKit substrate for composite `access_node`.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
# R55.G.22 §5.49 — `pinion_core::test_fixtures::assert_widget_view_carries_tag`
# regression helper for the [[composite-paint-root-tag-convention]] (R55.G.17).
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
