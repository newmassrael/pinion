[package]
name = "hello-virtual-table"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R775 §5.27 virtualized data-grid: a 10,000-row M3 table with a frozen header above a flex-viewport (AutoSizer) virtualized body; rendered row count tracks window resize, deep rows never materialize. Reuses the R774 windowing substrate + the R730 column model."
publish = false

[[bin]]
name = "hello-virtual-table"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R775 §5.27 — `view_virtual_table` (flex-viewport data-grid body).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
