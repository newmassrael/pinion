[package]
name = "hello-analyzer-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1648 Phase-B plane-C integration consumer — the analysis-tool dashboard shell assembled as ONE app: an app bar (source, capture toggle, global search, theme), a navigation rail, and a twelve-card board on pinion_core::widgets::tile_grid. Every card is a pinion_core::widgets::card::Card, so its header affordances and its body state (ready / loading / empty / failed / denied / opaque) are values on the wire rather than paint, and each not-ready card publishes the derived Remedy a person can act on. Named layout presets are stored TileGrid values; maximise hands back a TileGrid::Maximized token; tear-off drives the existing DockPanelPolicy. This is the assembly that the analysis-tool census's `app` verdicts are proven by."
publish = false

[[bin]]
name = "hello-analyzer-shell"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# §5.40 AccessKit substrate for `WidgetA11y::access_node`.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
# §5.16 paint-side AppShell (winit + Vello + RPC).
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1897 — a person's own layout arrangements are kept between runs.
pinion-platform-storage = { path = "../../crates/pinion-platform-storage", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through pinion-gpu.
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
# The KPI card's sparkline, which is the capability list's own example of a
# widget assembled from a box, a label and a chart primitive.
pinion-chart = { path = "../../crates/pinion-chart", version = "0.0.1" }
# R1662 — the scrolling-pane assembly the board sits in.
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# ★★★★★ R1724 — the axis that makes this the analysis tool's ONE application:
# a destination's page can be another binding, mounted whole.
pinion-screen = { path = "../../crates/pinion-screen", version = "0.0.1" }
# The node lab destination's page. The library half of the standalone
# `hello-node-lab` binary — the same screen, unedited. (Ask for its size with
# `find examples/hello-node-lab/src -name '*.rs' | xargs wc -l`; a number
# written here goes stale the first time anybody edits that screen.)
hello-node-lab = { path = "../hello-node-lab" }
# ★★★★★ R1729 — and the capture destination's page, the same way. With this
# the shell's rail has ONE seat left that says *built, shipping, and not here*
# — and that one is a section the reference implements and this build has not,
# so it says `unbuilt` rather than `elsewhere`.
hello-packet-view = { path = "../hello-packet-view" }
# ★★★★★ R1730 — the key-pattern destination's page. Unlike the two above, this
# one was BUILT for the seat rather than mounted into it: the section existed
# nowhere in this tree, and its own surfaces are checked against
# `docs/analyzer-keys-spec.json`.
hello-key-patterns = { path = "../hello-key-patterns" }
# ★★★★★ R1731 — the log destination's page, and the one that closes the rail:
# with it every section the reference opens is one this application opens.
hello-log-view = { path = "../hello-log-view" }
# ★★★★★ R1947 — the topology destination's page, and the FIRST seat this build
# opens that the scope mockup draws locked: the behaviour reference builds this
# section, so opening it is the second stage arriving rather than a
# reproduction gap closing. `docs/analyzer-rail-spec.json` records the
# divergence instead of hiding it.
hello-topology-view = { path = "../hello-topology-view" }
# ★★★★★ R1948 — the sessions destination's page, and the LAST seat this rail
# refused. With it every section the behaviour reference builds is one this
# application opens, and `spec::Seat` is gone: nothing constructs a reserved
# seat any more, which the compiler reported rather than a reader noticing.
hello-sessions-view = { path = "../hello-sessions-view" }
vello = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }
# R1653 — the painted-geometry check runs the real view -> layout pipeline.
pinion-runtime = { path = "../../crates/pinion-runtime", version = "0.0.1" }
# R1811 — the slack gate measures with the SAME cache the layout shaped with;
# a stand-in measure would answer about a font nobody painted.
pinion-text = { path = "../../crates/pinion-text", version = "0.0.1" }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
