[package]
name = "hello-encoded-answer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1480 §5.15 §5.7 §2 #7 — a surface whose answer is already encoded hands the bytes to the wire instead of a Value DOM"
publish = false

[[bin]]
name = "hello-encoded-answer"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
serde = { workspace = true }
# R1480 §5.15 — the tests render the control answer to compare encodings.
serde_json = { workspace = true }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
