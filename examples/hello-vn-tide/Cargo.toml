[package]
name = "hello-vn-tide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "the-tide VN Stage 0 — a typewriter dialogue + timed-choice set-piece (pinion-narrative vn runner) driven over JSON-RPC on the pinion_shell GUI shell, with a deterministic tick step-verb (the §2 #2 wire proof for the VN render axis)"
publish = false

[[bin]]
name = "hello-vn-tide"
path = "src/main.rs"

[dependencies]
# Scene primitives + the External / IntrospectValue introspection triad +
# WidgetCore binding trait.
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# WidgetA11y supertrait of WidgetView (the graph lowers to a labelled node).
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
# The reusable VN runner: VnScript / VnState / VnExternal / vn_scene — all the
# substance lives here; this binary is the thin shell binding.
pinion-narrative = { path = "../../crates/pinion-narrative", version = "0.0.1" }
# The GUI AppShell: winit window + Vello + the built-in stdin JSON-RPC reader
# (reply -> stdout). This is what makes the binding RpcSubprocess-driveable,
# and — unlike pinion_tui — it paints to a GPU window, so stdout stays a clean
# RPC channel.
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# The concrete VelloRenderer the forge codegen (app.pinion.xml) emits is
# `::vello::*`-qualified, so the include names the vello crate directly.
vello = { workspace = true }

[build-dependencies]
# Build-time codegen for the `HelloVnTideRenderer` Vello wrapper from
# `app.pinion.xml` — identical pattern to hello-audio-rt.
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
