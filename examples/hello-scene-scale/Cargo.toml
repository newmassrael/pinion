[package]
name = "hello-scene-scale"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1538 §5.16 pro-tool performance: the large-scene end-to-end harness. One binding whose dataset grows 1e2 -> 1e6 at runtime and whose list is virtualized or eager on demand, so scene/frame_timings' node census can be asserted scale-invariant in the first arm and linear in the second — a deterministic 60fps-at-scale guard with no wall-clock threshold."
publish = false

[[bin]]
name = "hello-scene-scale"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
