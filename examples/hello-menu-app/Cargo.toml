[package]
name = "hello-menu-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R832 §5.40 §5.50 §5.38 — own-rendered application menu bar. The R805 MenuBar substrate composed as application chrome: File/Edit/View commands drive a real document model (content + dirty flag), exposed for AI-first introspection through a QueryOnlyIntrospect node. The first menu-DRIVEN pinion application (vs hello-menu's standalone menu-widget demo)."
publish = false

[[bin]]
name = "hello-menu-app"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
