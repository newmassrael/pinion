[package]
name = "hello-toggle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R51.29 §5.38 paint-side N=2: winit window + R51.2 Toggle SCXML statechart end-to-end on the Vello path (R51.30 pinion-shell migration — application supplies WidgetView only)"
publish = false

[[bin]]
name = "hello-toggle"
path = "src/main.rs"

[dependencies]
# §5.38 Tier-1 Toggle widget + its `External` adapter; the WidgetView
# impl reaches into `ToggleExternal::new()` and the typed `ToggleEvent`
# / `ToggleState` enums + the `Toggle::is_on` value sidecar.
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# R51.30 paint-side AppShell. The shell pulls pinion-runtime (vello
# feature) + pinion-rpc + pinion-text + winit + pollster transitively,
# so this example's direct dep list collapses to "the widget I'm
# showcasing + the shell + vello for the codegen output types".
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R46.5 §5.16: the `HelloToggleRenderer` struct emitted by `build.rs`
# references `::vello::*` and `::vello::wgpu::*` directly (R46.3.3
# fully-qualified codegen path); the `vello_renderer_impl!` macro
# expansion also names `::vello::Scene` and `::vello::peniko::Color`.
vello = { workspace = true }

[build-dependencies]
# R46.5 §5.16: build-time codegen for the `HelloToggleRenderer` Vello
# wrapper. Identical pattern to hello-button / ai-introspect-demo.
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
