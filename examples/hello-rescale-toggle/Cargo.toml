[package]
name = "hello-rescale-toggle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1381 §5.38 hide the dominant series to rescale the axes to the rest — forcing consumer of LineChart::rescale_to_visible over the R1380 interactive legend"
publish = false

[[bin]]
name = "hello-rescale-toggle"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-chart = { path = "../../crates/pinion-chart", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
