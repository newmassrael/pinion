[package]
name = "figma-button-m3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R635 §5.7 — first Figma → pinion design-parity binding. Re-creates the Material 3 'Filled / Enabled' Button (109×40, #675AA4 fill, 100px radius, Roboto Medium 14px white label) from the Material 3 Design Kit Community file; the spec was extracted via `pinion figma-verify` (R634)."
publish = false

[[bin]]
name = "figma-button-m3"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
