[package]
name = "hello-file-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R787 §5.15 §5.16 own-rendered file browser: a scene-graph-native (not OS-native) directory browser over the pinion-core Directory read trait (the §3 escape hatch, peer of R665 Storage). Navigate dirs + select a file entirely via scene/query + scene/invoke; entries are paint nodes, not an opaque native dialog. Seeded InMemoryDirectory backing for a deterministic demo; FsDirectory is the real-fs production impl."
publish = false

[[bin]]
name = "hello-file-browser"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
