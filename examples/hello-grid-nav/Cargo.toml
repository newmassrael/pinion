[package]
name = "hello-grid-nav"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R777 §5.27 data-grid keyboard navigation at scale: a 10,000-row selectable virtualized data-grid (frozen header + flex-viewport body) whose Arrow/Home/End/PageUp/PageDown keys move the index-model row selection and scroll the target row into view; a cell click selects its row. Composes R746 VirtualSelect + R775 view_virtual_table + R776 scroll_offset_to_reveal."
publish = false

[[bin]]
name = "hello-grid-nav"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
