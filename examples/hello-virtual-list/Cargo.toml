[package]
name = "hello-virtual-list"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R744 §5.27 Model/View virtualization first consumer: a 10,000-row list that renders scene nodes for only the visible window (react-window FixedSizeList technique) over the existing ScrollNode substrate; full-height sizer preserves the scroll bound; WAI-ARIA list with aria-setsize=total + per-visible-row aria-posinset."
publish = false

[[bin]]
name = "hello-virtual-list"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R744 §5.27 — `view_virtual_list` windowed-list assembly + the
# `view_vertical_scrollbar` peer (R659 lift).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
