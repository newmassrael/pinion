[package]
name = "hello-streaming-log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R996 §5.22 §5.23 §5.27 Model-View streaming-append: a virtualized log whose row count GROWS at runtime. An Emit button (reducer) appends a batch of lines to a shared append-only source; the reactive count Signal flows through the stateless compute_visible_range / view_virtual_list windowing so the window + scroll extent grow with no refetch, and a STATELESS tail-follow (if the viewport was at the bottom, it stays at the bottom as rows append — `tail -f`) keeps the newest line in view. The streaming backbone for terminal scrollback / packet capture / log tail."
publish = false

[[bin]]
name = "hello-streaming-log"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R744 §5.27 — `view_virtual_list` windowed-list assembly + the
# `view_vertical_scrollbar` peer (shared with hello-lazy-list).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
