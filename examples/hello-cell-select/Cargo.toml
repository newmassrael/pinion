[package]
name = "hello-cell-select"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R953 §5.38 cell range selection grid — the dedicated consumer of the R952 Table SelectItems API (anchor + extent rectangle over a single TableExternal at the composite paint root 'grid'); the spreadsheet / Qt QTableView SelectItems model: arrows collapse the selection to the cursor cell, Shift+arrows extend the rectangle, Escape clears; per-cell aria-selected; bordered accent overlay; no row selection, no sort (one selection model per example vs hello-table's SelectRows)"
publish = false

[[bin]]
name = "hello-cell-select"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# R51.64 §5.40 — AccessKit substrate for `WidgetA11y::access_node`.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R952 §5.50 — data-grid paint composition (`view_table` + `TableSelection`).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1222 §5.22 — platform clipboard for the Ctrl+C range copy (TSV).
pinion-platform-clipboard = { path = "../../crates/pinion-platform-clipboard", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
# R55.G.22 §5.49 — composite-paint-root-tag regression helper.
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
