[package]
name = "hello-time-chart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1529 time-axis chart consumer — the forcing consumer for pinion-chart's ValueScale::Time (Qt QDateTimeAxis / d3 scaleUtc). A four-hour incident window straddling midnight is plotted twice from one dataset: on the numeric x-axis every one of the nine gridlines prints the same string, because the nice-number step is decimal while time is mixed-radix and the SI label compacts an epoch millisecond by magnitude. One toggle switches the x-axis to UTC time, where ticks land on the half hour and each label names the finest calendar field that distinguishes it — so the date appears exactly once, at the midnight crossing."
publish = false

[lints]
workspace = true

[dependencies]
# R1529 — the time axis under test (LineChart::x_time -> Scene).
pinion-chart = { path = "../../crates/pinion-chart", version = "0.0.1" }
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# §5.40 AccessKit substrate for the toggle-button a11y node.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# §5.16 — the `HelloTimeChartRenderer` struct emitted by build.rs names `::vello::*`.
vello = { workspace = true }

[build-dependencies]
# Build-time codegen for the `HelloTimeChartRenderer` Vello wrapper.
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }
