[package]
name = "hello-tooltip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R695 §5.16 §5.35 §5.40 §5.50 — first consumer of the Tooltip widget (pinion_core::widgets::tooltip) + pinion_widget_paint::tooltip chrome + the scene/hover RPC primitive. Two hover/focus-triggered descriptive popups (WCAG 1.4.13 hoverable/dismissible/persistent) with anchored positioning that flips on viewport overflow and aria-describedby linking each trigger to its tooltip."
publish = false

[[bin]]
name = "hello-tooltip"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
