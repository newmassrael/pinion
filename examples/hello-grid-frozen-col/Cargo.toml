[package]
name = "hello-grid-frozen-col"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R859 §5.27 frozen-left-column data-grid: a 10,000-row virtualized grid whose first columns are PINNED against the horizontal scroll (the spreadsheet 'frozen row-headers' an asset-browser / scene-outliner needs) while the metadata columns scroll sideways. The two panes share the vertical body scroll via the R859 linked-scroll follower ScrollNode, so they scroll in vertical lockstep without the measured-viewport oscillation a second publisher would cause."
publish = false

[[bin]]
name = "hello-grid-frozen-col"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R859 §5.27 — `view_virtual_table` with `frozen_cols` (the frozen-left column).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
