[package]
name = "hello-key-patterns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1730 Phase-B plane-C integration consumer — the analysis tool's key-pattern section, the third seat of the reference's rail, assembled against a written-down specification of the reference screen (docs/analyzer-keys-spec.json) rather than beside one. A 46-high section header carrying a derived summary and a live filter, a seven-column declaration list, and a 320-wide record pane of eleven parts whose last is an action into a section the specification locks. Every one of the three surfaces publishes its conformance with the specification on the wire, read out of the PAINTED scene through pinion_core::conformance."
publish = false

# ★★★★★ R1730 — this package is BOTH a screen and a page, from its first
# round.
#
# The library is the screen; the binary is four lines that run it in a window
# of its own. `hello-node-lab` took this shape at R1724 and `hello-packet-view`
# at R1729, both as a later edit, and the second of those measured what the
# edit costs: turning a binary into a library makes its doc comments PUBLIC API
# documentation, and eight intra-doc links that had been private became
# rustdoc failures without one line of code changing. Starting here costs
# nothing and pays that debt forward.
[lib]
name = "hello_key_patterns"
path = "src/lib.rs"

[[bin]]
name = "hello-key-patterns"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# §5.40 AccessKit substrate for `WidgetA11y::access_node`.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
# §5.21 — the scrolling pane, so a list longer than its viewport is reachable
# rather than painted past the edge.
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# §5.16 paint-side AppShell (winit + Vello + RPC).
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through pinion-gpu.
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }
# R1653 — the integration test runs the real view -> layout pipeline, so the
# rectangles it asserts against are the ones the window would paint.
pinion-runtime = { path = "../../crates/pinion-runtime", version = "0.0.1" }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
