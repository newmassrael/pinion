[package]
name = "hello-stepper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R750 §5.38 §5.40 horizontal stepper: a Group of step Buttons with aria-current=\"step\" on the active step (the 2nd AriaCurrent consumer, the Step variant minted in R731 for exactly this widget); pure composition over RadioGroupExternal (current step = 1-of-N selection), substrate-0 interaction with tri-state completed/current/upcoming indicator paint"
publish = false

[[bin]]
name = "hello-stepper"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
