[package]
name = "hello-grid-hscroll"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R784 §5.45 horizontal scroll + frozen header at scale: a 10,000-row virtualized data-grid whose 8 columns are wider than the window, so the grid scrolls horizontally; the frozen header shares one horizontal scroll with the body, so it tracks the body's horizontal offset while staying vertically pinned. Adds the ScrollAxis::Horizontal layout substrate (width-unbounded scroll content) + the nested outer-horizontal / inner-vertical composition in view_virtual_table."
publish = false

[[bin]]
name = "hello-grid-hscroll"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R784 §5.45 — `view_virtual_table` with the frozen-header horizontal scroll.
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
