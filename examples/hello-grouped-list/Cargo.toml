[package]
name = "hello-grouped-list"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R843 §5.27 §5.40 group-by on a virtualized list: 10,000 rows partitioned into 6 collapsible asset-type groups by a group-by view-order proxy (GroupOrderExternal), windowed via view_virtual_list (headers + data rows in one uniform-pitch sequence), composed with data-indexed single-select (VirtualSelectExternal) so collapsing a group hides its rows without disturbing the selection."
publish = false

[[bin]]
name = "hello-grouped-list"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R744 §5.27 — `view_virtual_list` windowed-list assembly + the
# `view_vertical_scrollbar` peer (R659 lift).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
