[package]
name = "hello-number-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R736 §5.38 §5.40 §5.50 editable number input — a typeable WAI-ARIA spinbutton (the <input type=number> / GTK editable SpinButton form factor); composition of a TextFieldExternal draft + Signal<f32> value SSOT + two ButtonExternal steppers; 2nd consumer of the editable-field value-coordination pattern (after hello-combobox-editable), zero new substrate"
publish = false

[[bin]]
name = "hello-number-input"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# R51.64 §5.40 — AccessKit substrate for `WidgetA11y::access_node`.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R736 §5.50 — lifted TextField paint helpers (view_field + read_text_field_state).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
# composite-paint-root-tag regression helper.
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
