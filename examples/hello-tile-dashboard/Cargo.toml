[package]
name = "hello-tile-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1608 Phase-B plane-C consumer — a monitoring-tool-class tile dashboard over the R1560 CSS Grid. Cards live on twelve Fr(1.0) columns at (col,row,w,h); a press-drag snaps to grid cells and moves the card, displacing whatever it lands on downward, and every displacement is NAMED. The arrangement is pinion_core::widgets::tile_grid::TileGrid, so the whole layout is one serializable value an agent can read and edit over the wire — scene/query /external/layout returns it as JSON and scene/invoke drives move_to / resize / compact with no pixel."
publish = false

[[bin]]
name = "hello-tile-dashboard"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# §5.40 AccessKit substrate for `WidgetA11y::access_node`.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
# §5.16 paint-side AppShell (winit + Vello + RPC).
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through pinion-gpu.
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
