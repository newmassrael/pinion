[package]
name = "hello-tree-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R673 §5.16 §5.50 — 2nd pinion_widget_paint::tree_view consumer. Keyboard-driven hierarchical browser exercising the TreeView substrate's interactive surface (focused row highlight, Arrow Up/Down/Left/Right navigation, Space/Enter toggle, Home/End jump)."
publish = false

[[bin]]
name = "hello-tree-view"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
serde = { workspace = true, features = ["derive"] }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
