[package]
name = "hello-market-map"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1439 §5.35 — the two-variable treemap: a tile's AREA encodes one measure and its COLOUR an independent second one through pinion_chart::ColorScale, with a VERTICAL colour bar whose mirrored gradient stops report the encoding (high at the top). Every claim is queryable over RPC as hex + offsets."
publish = false

[[bin]]
name = "hello-market-map"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1439 — the treemap's second encoding channel + the vertical colour bar.
pinion-chart = { path = "../../crates/pinion-chart", version = "0.0.1" }
# A `Signal<T>` payload is persistable, so the encoding enum derives serde.
serde = { workspace = true }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
