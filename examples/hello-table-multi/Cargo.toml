[package]
name = "hello-table-multi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R735 §5.38 multi-select data Table — WAI-ARIA grid with aria-multiselectable=true (the 2-D grid analog of ListBox multi-select, 2nd consumer of aria-multiselectable after hello-listbox-multi) over a single TableExternal::with_multiselect coordinator; activating a row toggles only that row's selection bit (no sibling-deselect), so any subset of rows reports aria-selected=true; APG data-grid 2-D roving active descendant + Enter/Space toggle"
publish = false

[[bin]]
name = "hello-table-multi"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# R51.64 §5.40 — AccessKit substrate for `WidgetA11y::access_node`.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R707 §5.50 — data-table paint composition (`view_table`).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
# R55.G.22 §5.49 — composite-paint-root-tag regression helper.
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
