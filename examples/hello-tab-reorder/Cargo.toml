[package]
name = "hello-tab-reorder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R743 §5.51 — second consumer of the generic drag-and-drop substrate (External::begin_drag / drag_to / drag_release + the InputRouter drag session): a reorderable Material 3 tab strip. Tabs drag horizontally to reorder; the selected tab is tracked by stable id so a reorder is a pure permutation that never changes the selection. Selection reuses RadioGroupExternal; the drag reuses the R742 hooks unchanged."
publish = false

[[bin]]
name = "hello-tab-reorder"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }
# `query` exposes the visual order / selected id / drag preview as
# structured `IntrospectValue::Json` for §2 #7 scene-as-data.
serde_json = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
