[package]
name = "hello-range-slider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R738 §5.38 §5.40 dual-thumb range slider — WAI-ARIA Slider (Multi-Thumb) / Material range slider; new RangeSliderExternal substrate (nearest-thumb pick + monotonic low<=high) coordinates two thumbs on one shared track; two-Tab-stop APG keyboard; 1st consumer of the R738 range-slider substrate"
publish = false

[[bin]]
name = "hello-range-slider"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R738 §5.38 — lifted slider M3 color contract (4-consumer SSOT).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
