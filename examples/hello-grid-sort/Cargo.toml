[package]
name = "hello-grid-sort"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R778 §5.27 §5.40 data-grid sort at scale: a 10,000-row virtualized data-grid (frozen header + flex-viewport body) whose clickable column headers cycle a numeric-aware multi-column sort; the row selection is data-indexed so it survives a re-sort (selection ⊥ ordering). Composes R746 VirtualSelect + R775 view_virtual_table + R778 GridSortExternal."
publish = false

[[bin]]
name = "hello-grid-sort"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
