[package]
name = "hello-print"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R833 §3 §5.53 §5.15 — own-rendered print dialog. Composes the pinion-core PrintBackend substrate (InMemoryPrintBackend headless / CupsPrintBackend real CUPS) as a printer-pick + copies + Print dialog; the submitted job is exposed for AI-first introspection. No native print dialog — own-rendered + CUPS, fully Linux-RPC-verifiable."
publish = false

[[bin]]
name = "hello-print"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# R911 §5.53 — own-renderer Scene -> PDF: the print job now carries the
# rendered document (the 2nd consumer of the R908 pinion-pdf substrate),
# completing the own-renderer print story (was a plain-text blob).
pinion-pdf = { path = "../../crates/pinion-pdf", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
pinion-platform-print = { path = "../../crates/pinion-platform-print", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
