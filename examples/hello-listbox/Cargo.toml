[package]
name = "hello-listbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R51.97 §5.38 ListBox composite first-client: WAI-ARIA Listbox keyboard model (Arrow=focus only, Space/Enter=commit), single-select with N=4 options, AccessKit Listbox+Option role surfacing, R51.93 PointerCancel propagation, end-to-end visual + AT evidence for the R51.95/R51.96 framework primitives."
publish = false

[[bin]]
name = "hello-listbox"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R659 §5.45 — view_vertical_scrollbar lifted from this binding's
# pre-R659 `build_scrollbar_visual` (2nd consumer signal triggered by
# the R659 todomvc scrollbar peer wire).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
# R55.G.22 §5.49 — `pinion_core::test_fixtures::assert_widget_view_carries_tag`
# regression helper for the [[composite-paint-root-tag-convention]] (R55.G.17).
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
