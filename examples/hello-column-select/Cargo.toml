[package]
name = "hello-column-select"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1563 §5.40 a selection with two axes: a 10,000-row by 8-column virtualized data-grid whose selection is a set of CELLS. A column header selects the column through it (the toolkit sectionPressed), a cell press selects one cell (the toolkit SelectItems), Shift extends a rectangle, and the selection is held as canonical BANDS so the whole model is one band and eleven bytes on the wire."
publish = false

[[bin]]
name = "hello-column-select"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
