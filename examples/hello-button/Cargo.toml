[package]
name = "hello-button"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "First dogfood (§4): winit window + R12 Button SCXML statechart end-to-end (R51.30 pinion-shell migration — application supplies WidgetView only)"
publish = false

[[bin]]
name = "hello-button"
path = "src/main.rs"

[dependencies]
# §5.38 Tier-1 Button widget + its `External` adapter; the WidgetView
# impl reaches into `ButtonExternal::new()` and the typed `ButtonEvent`
# / `ButtonState` enums.
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# R51.63 §5.40 — `AccessNode` / `AriaRole` types for the `access_node`
# WidgetView override. pinion-shell re-export remains intentionally
# minimal (only the shell-internal substrate is re-exported) so each
# widget binding imports a11y primitives directly.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
# R51.30 paint-side AppShell. The shell pulls pinion-runtime (vello
# feature) + pinion-rpc + pinion-text + winit + pollster transitively,
# so this example's direct dep list collapses to "the widget I'm
# showcasing + the shell + vello for the codegen output types".
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R46.5 §5.16: the `HelloButtonRenderer` struct emitted by `build.rs`
# references `::vello::*` and `::vello::wgpu::*` directly (R46.3.3
# fully-qualified codegen path); the `vello_renderer_impl!` macro
# expansion also names `::vello::Scene` and `::vello::peniko::Color`.
# Either dependency makes vello a direct dep.
vello = { workspace = true }

[dev-dependencies]
# R55.G.22 §5.49 — `pinion_core::test_fixtures::assert_widget_view_carries_tag`
# regression helper for the [[composite-paint-root-tag-convention]] (R55.G.17).
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
# R46.5 §5.16: build-time codegen for the `HelloButtonRenderer` Vello
# wrapper. `build.rs` calls `compile_file` on `app.pinion.xml`; the
# emitted Rust is written to `$OUT_DIR/app.rs` and `include!`d by
# main.rs.
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
