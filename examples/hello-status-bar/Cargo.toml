[package]
name = "hello-status-bar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R913 §5.38 §5.22 editor status bar — the bottom chrome of an editor shell: a reactive cursor-position segment (Ln/Col), clickable language-mode + encoding segments that cycle on click, and a message area. Composes a primary External + named-segment send-wire clicks; fully RPC-introspectable (position/mode/encoding/message)."
publish = false

[[bin]]
name = "hello-status-bar"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-derive = { path = "../../crates/pinion-derive", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
