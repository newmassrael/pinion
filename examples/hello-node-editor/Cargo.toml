[package]
name = "hello-node-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R838 §5.38 §5.40 §5.51 node-graph editor substrate — a canvas of titled nodes with input/output ports connected by bezier edges; the visual-scripting / material-graph form factor and the self-hosted-editor blueprint panel seed. Nodes drag-to-move via the R51.34 capture lock, edges drag-to-connect via the R742 drag substrate, both mirrored on the AI-first RPC introspect path (intervene node position / invoke add_edge)"
publish = false

[[bin]]
name = "hello-node-editor"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# R838 §5.40 — AccessKit substrate (the graph lowers to a labelled node list).
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1442 — the layered (Sugiyama) layout the `auto_layout` verb runs, lifted out
# of this example when the live topology view became its second consumer.
pinion-graph = { path = "../../crates/pinion-graph", version = "0.0.1" }
# R1596 — the node MODEL: R1577 lifted it out of this example into a crate and
# left the example on its own copy, so the tree carried two. This is the one.
pinion-node-graph = { path = "../../crates/pinion-node-graph", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }
# R838 — the graph model lives in reactive `Signal`s, which require their
# payloads to be (de)serializable for the §2 #7 scene-as-data snapshot path.
serde = { workspace = true }
# R852 — graph serialization (save / load): the §3 §5.15 Storage substrate +
# JSON (de)serialization of the persistable graph snapshot.
serde_json = { workspace = true }
pinion-platform-storage = { path = "../../crates/pinion-platform-storage", version = "0.0.1" }
# R878 — the inline node-rename editor paints through the shared TextField
# paint substrate (`view_field` / `read_text_field_state` /
# `forward_composition_to_field`).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }

[dev-dependencies]
# composite-paint-root-tag regression helper.
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
