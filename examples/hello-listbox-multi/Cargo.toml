[package]
name = "hello-listbox-multi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R51.104 §5.38 ListBox multi-select first-client: WAI-ARIA aria-multiselectable=\"true\" keyboard model (Arrow=focus, Space/Enter=toggle), 6 options with overlapping prefixes for R51.103 multi-char type-ahead evidence, AccessKit Listbox+Option role surfacing with per-row aria-selected, end-to-end visual + AT evidence for the R51.98 multi-select primitive."
publish = false

[[bin]]
name = "hello-listbox-multi"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
# R55.G.22 §5.49 — `pinion_core::test_fixtures::assert_widget_view_carries_tag`
# regression helper for the [[composite-paint-root-tag-convention]] (R55.G.17).
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
