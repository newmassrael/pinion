[package]
name = "hello-polar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1568 polar consumer — the forcing consumer for pinion-chart's AngularScale and PolarChart, the crate's first non-cartesian coordinate system (Qt QPolarChart). An angular axis is PERIODIC: a bearing outside the period is the same place as its wrapped twin rather than a value the axis fails to reach, a series closes on itself by derivation instead of by a duplicated datum, and the tick at the end of the period is the tick at its start. Qt models the angular axis with an ordinary QValueAxis, so it has none of that, hard-codes 12-o'clock and clockwise, is always a full circle, and auto-scales a period that no sample reveals."
publish = false

[lints]
workspace = true

[dependencies]
# R1568 — the polar coordinate system and the polar chart under test.
pinion-chart = { path = "../../crates/pinion-chart", version = "0.0.1" }
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# §5.40 AccessKit substrate for the radiogroup + toggle-button a11y nodes.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through pinion-gpu.
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
# The lifted option chip the form radio and the two option toggles wear.
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
# Build-time codegen for the `HelloPolarRenderer` Vello wrapper.
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }
