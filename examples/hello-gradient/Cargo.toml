[package]
name = "hello-gradient"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R708 §5.50 gradient-fill rendering substrate consumer — a linear hue strip (the ColorPicker R709 hue-bar precursor) plus a linear/radial demo swatch driven by a Toggle, the first BoxStyle.gradient paint; substrate-first, the gradient is introspectable via scene/snapshot and verifiable by live-pixel sampling"
publish = false

[[bin]]
name = "hello-gradient"
path = "src/main.rs"

[dependencies]
# §5.38 Toggle widget reused as the linear/radial gallery switch (the
# binding paints gradients; the Toggle is the RPC-drivable mode bit).
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# R51.64 §5.40 — AccessKit substrate for `WidgetView::access_node`.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
# R653 §5.16 — `#[pinion_derive::widget(...)]` emits the WidgetCore +
# WidgetA11y + WidgetView forwarding trio.
pinion-derive = { path = "../../crates/pinion-derive", version = "0.0.1" }
# R51.30 paint-side AppShell (pulls pinion-runtime/vello + pinion-rpc +
# winit transitively).
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R46.5 §5.16: the `HelloGradientRenderer` struct emitted by `build.rs`
# names `::vello::*` directly; the `vello_renderer_impl!` expansion also
# names `::vello::Scene` / `::vello::peniko::Color`.
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
# R55.G.22 §5.49 — composite-paint-root-tag regression helper.
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
# R46.5 §5.16: build-time codegen for the `HelloGradientRenderer` Vello
# wrapper. Identical pattern to hello-button / hello-toggle.
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
