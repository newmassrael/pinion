[package]
name = "hello-dock-panels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R683.C §5.16 §5.41 §5.45 first dock-panel + tear-off consumer. DevTools inspector / property pane / viewport in a Splitter + DockPanel topology. Tear off a panel by dragging its header past 0.5 fraction → new floating WindowSpec; drag it back past threshold → window closes + panel reattaches. 2nd ClickRouter consumer (R679 Rule-of-Three closure)."
publish = false

[[bin]]
name = "hello-dock-panels"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
