[package]
name = "hello-dialog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R693 §5.16 §5.39 §5.40 §5.50 — first consumer of the modal-focus-trap substrate + pinion_widget_paint::dialog chrome. A destructive-confirm modal (Cancel/Delete) over real Button externals; opening traps Tab to the dialog controls, auto-focuses the first, blocks the scrimmed background, and Escape/Cancel/Delete restore focus to the trigger."
publish = false

[[bin]]
name = "hello-dialog"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
