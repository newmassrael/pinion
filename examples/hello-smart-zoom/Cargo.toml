[package]
name = "hello-smart-zoom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1435 §5.35 §5.15 — a native smart-zoom gesture fits the block under the finger. A widget that overrides External::smart_zoom_gesture toggles a document page between fit-to-page and zoom-to-block (the toolkit native gesture event SmartZoomNativeGesture / macOS smartMagnify / winit DoubleTapGesture), the family's phase-less member: one completed toggle, no arc, and the cursor anchor is what selects which block fills the view. winit exposes DoubleTapGesture only on macOS/iOS, so the scene/smart_zoom_gesture RPC is the AI-first driver (§2 #2)."
publish = false

[[bin]]
name = "hello-smart-zoom"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
