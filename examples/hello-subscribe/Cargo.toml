[package]
name = "hello-subscribe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1552 §5.7 PINION-PR83 reference consumer — one scene/subscribe opens a change stream the server writes to unprompted, so a client follows the scene without re-issuing a request per revision; the live streams are reflected into the scene as data"
publish = false

[[bin]]
name = "hello-subscribe"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1552 §5.7 — the RpcEgress seam and the subscription registry this reads.
pinion-rpc = { path = "../../crates/pinion-rpc", version = "0.0.1" }
# R1552 §5.7 — the Unix-socket transport, so the demo can prove per-connection
# attribution with two independent clients (stdin is one connection only).
pinion-rpc-transport = { path = "../../crates/pinion-rpc-transport", version = "0.0.1" }
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
