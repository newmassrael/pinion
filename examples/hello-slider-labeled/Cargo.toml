[package]
name = "hello-slider-labeled"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R739 §5.38 §5.40 §5.50 labeled-step slider — WAI-ARIA aria-valuetext named stops (Off/Low/Medium/High/Max); 2nd consumer of the R737 step substrate + 1st consumer of the R739 AccessNode::value_text axis; the snapped value reads a named label instead of a bare number"
publish = false

[[bin]]
name = "hello-slider-labeled"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R737 §5.38 — shared read_slider_state introspect reader + slider color helpers.
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
