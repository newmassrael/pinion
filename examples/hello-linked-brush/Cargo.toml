[package]
name = "hello-linked-brush"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1394 numeric cross-type cross-filter consumer — the forcing consumer for pinion-chart's brush substrate lift and LineChart::select_x_range. One x-window brush (a sibling RangeSliderExternal, wired through the lifted pinion_chart::Brush — the third brush consumer after hello-chart and hello-scatter, which is what triggered the lift) cross-filters TWO unlike panels at once: a LineChart on top mutes its out-of-window portion to a context ghost with a full-colour in-window overdraw (LineChart::select_x_range, new in R1394), and a ScatterChart below mutes the points outside the window (R1391). A primary Slider scrub over the scatter is the secondary inspector. Exercises the shared brush wiring, both chart types' numeric cross-filter, and distinct tag prefixes end-to-end in the real windowed shell + over RPC."
publish = false

[lints]
workspace = true

[dependencies]
# R1394 — the two charts under test (LineChart + ScatterChart) and the lifted
# Brush substrate (`pinion_chart::Brush` / `BrushStripColors`).
pinion-chart = { path = "../../crates/pinion-chart", version = "0.0.1" }
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# §5.40 AccessKit substrate for `WidgetView::access_node`.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
# §5.16 — `#[pinion_derive::widget(...)]` emits WidgetCore + WidgetView (the
# `a11y_manual` opt-out leaves WidgetA11y to the hand-written impl in main.rs).
pinion-derive = { path = "../../crates/pinion-derive", version = "0.0.1" }
# §5.16 paint-side AppShell (winit + Vello + RPC).
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# §5.38 — shared slider introspect reader + ARIA keyboard scaffold
# (`read_slider_state` / `slider_apply_key`); the SliderExternal is reused as
# the scrub-position holder over the scatter (value 0..1 = the fraction).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# §5.16 — the `HelloLinkedBrushRenderer` struct emitted by build.rs names `::vello::*`.
vello = { workspace = true }

[dev-dependencies]
# `assert_widget_view_carries_tag`: the primary surface carries the widget tag.
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
# Build-time codegen for the `HelloLinkedBrushRenderer` Vello wrapper.
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }
