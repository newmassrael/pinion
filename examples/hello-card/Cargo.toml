[package]
name = "hello-card"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R757 §5.38 §5.40 Material 3 cards — elevated / filled / outlined clickable surfaces (3 ButtonExternals + inline card-surface paint, 1st card-paint consumer)"
publish = false

[[bin]]
name = "hello-card"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# R51.64 §5.40 — AccessKit substrate for `WidgetA11y::access_node`.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
# R757 §5.38 — the M3 elevation shadow ramp + state-layer SSOT + the
# ButtonExternal posture readers (`read_button_state` / `button_a11y_state`)
# the clickable cards reuse.
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
# R55.G.22 §5.49 — composite-paint-root-tag regression helper.
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
