[package]
name = "hello-toolbar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R692 §5.16 §5.40 §5.50 — first pinion_widget_paint::toolbar consumer. A roving-tabindex format toolbar (Bold/Italic/Underline toggle buttons + Undo/Redo command buttons) over a command-class ToolbarExternal; WAI-ARIA toolbar role + button children carrying aria-pressed, and the §3.4 keyboard model (Arrow Left/Right roving, Home/End jump, Enter/Space activate)."
publish = false

[[bin]]
name = "hello-toolbar"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
# R55.G.22 §5.49 — `pinion_core::test_fixtures::assert_widget_view_carries_tag`
# regression helper for the composite-paint-root-tag convention.
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
