[package]
name = "hello-column-visibility"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R990 §5.27 §5.38 §5.40 data-grid column hide/show: a column-chooser toolbar (one toggle per column, reflective aria-pressed = visible) drives a shared visibility model; the grid paints and announces only the visible columns. The sole remaining visible column's toggle is disabled (cannot hide everything) — the 2nd consumer of the R989 reflective toolbar disabled axis."
publish = false

[[bin]]
name = "hello-column-visibility"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }
# The column-visibility model lives in a reactive `Signal`, whose RPC
# introspection bound requires serde on the stored type (R988 precedent).
serde = { workspace = true, features = ["derive"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
