[package]
name = "hello-undo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R748 §5.52 undo/redo command stack: a counter editor whose +/- edits are recorded as reversible SignalEdit commands onto a shared UndoStack, with Undo/Redo buttons that grey out reactively at the history boundaries and an UndoStackExternal surfacing the history (index / labels / can_undo) to RPC."
publish = false

[[bin]]
name = "hello-undo"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R727 §5.16 — the lifted Material 3 button paint substrate.
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
