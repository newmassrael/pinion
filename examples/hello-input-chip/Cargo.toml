[package]
name = "hello-input-chip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R756 §5.38 §5.40 Material 3 input chips — deletable composite (ChipDeleteExternal over Signal<Vec>), 2nd consumer of the chip paint lift"
publish = false

[[bin]]
name = "hello-input-chip"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# R51.64 §5.40 — AccessKit substrate for `WidgetA11y::access_node`.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
# R756 §5.38 — the M3 chip paint substrate (chip_style / chip_layout) +
# the R752 state-layer SSOT it re-exports.
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }
# `Signal<Vec<InputChip>>` requires its element to be `Serialize +
# DeserializeOwned` (the reactive snapshot substrate); serde_json backs the
# `ids` introspect slot's JSON array.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# R55.G.22 §5.49 — composite-paint-root-tag regression helper.
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
