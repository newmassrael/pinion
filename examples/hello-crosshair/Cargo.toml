[package]
name = "hello-crosshair"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1406 §5.35 — a LineChart inspector crosshair that follows the BARE hover (no button), the 2nd consumer of the R1405 External::wants_hover_move seam. A plain hover forwards its position to the chart external, which stores the x fraction; the view feeds it to LineChart::inspect so the crosshair / markers / value tooltip track the pointer with no press. Proves the R1405 hover-move seam serves a structurally-different consumer with zero framework change."
publish = false

[[bin]]
name = "hello-crosshair"
path = "src/main.rs"

[dependencies]
# The dataviz substrate under test: LineChart::inspect / inspect_readout.
pinion-chart = { path = "../../crates/pinion-chart", version = "0.0.1" }
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
