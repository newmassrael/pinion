[package]
name = "hello-transcript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1445 §5.45 §5.27 reveal-what-was-appended when the appended extent is LAYOUT-MEASURED: a transcript of wrapped prose whose height only taffy/parley know. The binding names no bound at all — it arms ScrollState::follow_measured_tail and the layout pass pins the viewport to the extent it measures. Two policies ride the same one-shot: a reply (the answer to what the reader pressed) always reveals itself, an ambient notice follows only if the reader was already at the tail."
publish = false

[[bin]]
name = "hello-transcript"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R686 §5.16 — the shared M3 button paint substrate (both controls).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
