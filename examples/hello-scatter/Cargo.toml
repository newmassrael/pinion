[package]
name = "hello-scatter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1377 correlation-view chart consumer — the forcing consumer for pinion-chart's ScatterChart, the crate's third cartesian chart. A scatter plot of two labelled sample series with a scrub inspector: dragging the transparent capture surface scrubs the x-axis (its 1-D fraction maps to a data x), ringing each series' nearest point and showing its value in a tooltip whose readout also reaches a11y (the R1355 parity, now for scatter). Being the third axis chart, it is what forced the shared cartesian substrate to factor out — this binding exercises the point-mark geometry, the fraction-to-x scrub, and the shared axes/legend/circle furniture end-to-end in the real windowed shell + over RPC."
publish = false

[lints]
workspace = true

[dependencies]
# R1377 — the correlation chart under test (ScatterChart -> Scene).
pinion-chart = { path = "../../crates/pinion-chart", version = "0.0.1" }
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# §5.40 AccessKit substrate for `WidgetView::access_node`.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
# §5.16 — `#[pinion_derive::widget(...)]` emits WidgetCore + WidgetView (the
# `a11y_manual` opt-out leaves WidgetA11y to the hand-written impl in main.rs).
pinion-derive = { path = "../../crates/pinion-derive", version = "0.0.1" }
# §5.16 paint-side AppShell (winit + Vello + RPC).
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# §5.38 — shared slider introspect reader + ARIA keyboard scaffold
# (`read_slider_state` / `slider_apply_key`); the SliderExternal is reused as
# the scrub-position holder (value 0..1 = the fraction that scrubs the x-axis).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# §5.16 — the `HelloScatterRenderer` struct emitted by build.rs names `::vello::*`.
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
# R1360.2 — `assert_widget_view_paints_opaque_root`: this binding's root fill IS
# the window's clear colour.
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
# Build-time codegen for the `HelloScatterRenderer` Vello wrapper.
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }
