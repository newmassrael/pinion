[package]
name = "hello-datepicker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R704 §5.38 inline DatePicker — month calendar grid (WAI-ARIA grid role) over a single DatePickerExternal coordinator at the composite paint root 'datepicker'; day cells via composite '#' tags + APG date-grid roving (arrows clamped within month, Home/End, PageUp/Down month nav), single-day selection enforced by the framework coordinator"
publish = false

[[bin]]
name = "hello-datepicker"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# R51.64 §5.40 — AccessKit substrate for `WidgetA11y::access_node`.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R704 §5.50 — date-picker paint composition (`view_datepicker`).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
# R55.G.22 §5.49 — composite-paint-root-tag regression helper.
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
