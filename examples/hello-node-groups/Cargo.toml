[package]
name = "hello-node-groups"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1577 §5.38 §5.52 — a Blender-class node system COMPOSED from pinion-node-graph rather than hand-rolled: re-usable group definitions, instances, a derived interface, a nested edit path, and evaluation that descends. The point is what is absent — no model, no boundary derivation, no cycle test and no evaluator live here, because the framework owns them. Its length is the argument."
publish = false

[[bin]]
name = "hello-node-groups"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1577 — the node-system substrate this example exists to compose.
pinion-node-graph = { path = "../../crates/pinion-node-graph", version = "0.0.1" }
serde = { workspace = true }
# R1578 — a fragment's serialized size is published, which is the cheapest proof
# over the wire that a clipboard entry is a VALUE and not a handle.
serde_json = { workspace = true }
# R1537 §5.16 — the emitted renderer owns its wgpu device through pinion-gpu.
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
