[package]
name = "hello-multi-select"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R780 §5.40 multi-select index model: a 10,000-row flex-viewport (AutoSizer) virtualized list whose Shift+Arrow extends a contiguous range, Ctrl+A selects all, and Ctrl+Space toggles the active row. Extends R746 VirtualSelect into a Qt QItemSelectionModel ExtendedSelection coordinator (selection set + anchor), with aria-multiselectable + per-row aria-selected."
publish = false

[[bin]]
name = "hello-multi-select"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R780 §5.40 — `view_flex_virtual_list` AutoSizer assembly + the
# `view_vertical_scrollbar` peer.
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }
# R780 §5.40 — `IntrospectValue::Json` (serde_json::Value) decodes the
# `selection` index-set array off the coordinator for §2 #7 scene-as-data.
serde_json = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
