[package]
name = "hello-hyperlink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1405 §5.41 §5.35 OSC-8 hyperlink hover/click interaction over Scene::TextGrid (sprag PINION-PR71). Hovering a link cell lights its whole id-group (a wrap-split link lights together), shows the pointer/hand cursor (CursorHint::Pointer), and underlines it; clicking activates the URI. Reuses the R1403 hyperlink data model + the new wants_hover_move seam + cell_hyperlink convenience."
publish = false

[[bin]]
name = "hello-hyperlink"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
