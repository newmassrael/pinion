[package]
name = "hello-donut"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1376 part-of-whole chart consumer — the forcing consumer for pinion-chart's DonutChart. A donut of a labelled proportion breakdown with a scrub inspector: dragging the transparent capture surface scrubs the slices (its 1-D fraction maps to a slice index), ringing the focused slice and showing its value + percent share in a tooltip whose readout also reaches a11y (the R1355 parity, now for the donut). Proves the Bézier-arc sector geometry, the fraction-to-slice scrub mapping, and the inspect overlay end-to-end in the real windowed shell + over RPC."
publish = false

[lints]
workspace = true

[dependencies]
# R1376 — the part-of-whole chart under test (DonutChart -> Scene).
pinion-chart = { path = "../../crates/pinion-chart", version = "0.0.1" }
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# §5.40 AccessKit substrate for `WidgetView::access_node`.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
# §5.16 — `#[pinion_derive::widget(...)]` emits WidgetCore + WidgetView (the
# `a11y_manual` opt-out leaves WidgetA11y to the hand-written impl in main.rs).
pinion-derive = { path = "../../crates/pinion-derive", version = "0.0.1" }
# §5.16 paint-side AppShell (winit + Vello + RPC).
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# §5.38 — shared slider introspect reader + ARIA keyboard scaffold
# (`read_slider_state` / `slider_apply_key`); the SliderExternal is reused as
# the scrub-position holder (value 0..1 = the fraction that scrubs the slices).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# §5.16 — the `HelloDonutRenderer` struct emitted by build.rs names `::vello::*`.
vello = { workspace = true }

[dev-dependencies]
# R1360.2 — `assert_widget_view_paints_opaque_root`: this binding's root fill IS
# the window's clear colour.
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
# Build-time codegen for the `HelloDonutRenderer` Vello wrapper.
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }
