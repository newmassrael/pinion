[package]
name = "hello-virtual-columns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1523 §5.27 §5.45 column-axis virtualization: a 200-column x 10,000-row M3 data-grid that windows BOTH axes, so the scene tree holds only the cells the viewport exposes. Reuses the row axis' prefix-sum + visible-range arithmetic on the column axis."
publish = false

[[bin]]
name = "hello-virtual-columns"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1523 §5.27 — `view_virtual_table` (two-axis windowed data-grid body).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
