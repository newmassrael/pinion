[package]
name = "hello-node-flow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1599 §5.38 §5.52 — a visual script-class CONTROL graph composed from pinion-node-graph: a node declares which of its ports carry control, the two planes obey opposite link laws, a control cycle is a loop rather than a defect, and the execution ORDER is derived. What is absent is the argument — no scheduler, no cycle test and no law lives here, because the framework owns them."
publish = false

[[bin]]
name = "hello-node-flow"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-node-graph = { path = "../../crates/pinion-node-graph", version = "0.0.1" }
serde = { workspace = true }
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
