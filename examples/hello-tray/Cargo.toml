[package]
name = "hello-tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R949 §3 §5.53 system-tray substrate — pinion owns the tray model (id/icon/tooltip/status/menu); an InMemoryTrayBackend records it headlessly. The menu drives app state (show window / dark mode / bake assets / quit) and re-publishes on every change. Fully RPC-introspectable + scene-as-data (the SniTrayBackend D-Bus bridge is the follow-up platform round)."
publish = false

[[bin]]
name = "hello-tray"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-derive = { path = "../../crates/pinion-derive", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
