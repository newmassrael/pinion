[package]
name = "hello-refused-invoke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1564 §5.15 §5.12 §2 #2 — a refused invoke states WHY: the producer's own sentence reaches the JSON-RPC error.data verbatim, under a code that is not Invalid params"
publish = false

[[bin]]
name = "hello-refused-invoke"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1564 §5.12 — the tests drive the same typed dispatcher the wire uses, so
# they pin the code + reason the socket will publish.
pinion-rpc = { path = "../../crates/pinion-rpc", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
# R1564 §5.15 (PINION-PR82) — activate `pinion_core::test_fixtures::
# assert_refused_saying` for the refusal tests.
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1", features = [
    "test-fixtures",
] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
