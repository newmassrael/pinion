[package]
name = "hello-pinch-zoom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1432 §5.35 §5.15 — a native pinch (magnify) gesture zooms a viewport. A widget that overrides External::pinch_gesture accumulates the incremental magnification of a two-finger trackpad pinch (Qt QNativeGestureEvent ZoomNativeGesture) across the GesturePhase Begin..End arc, and discards the in-flight zoom on Cancel. winit exposes PinchGesture only on macOS/iOS, so the scene/pinch_gesture RPC is the AI-first driver (§2 #2): a headless client zooms the viewport with no trackpad, drivable + introspectable."
publish = false

[[bin]]
name = "hello-pinch-zoom"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
