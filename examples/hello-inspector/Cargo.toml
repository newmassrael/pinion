[package]
name = "hello-inspector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R909/R922 §5.38 §5.22 §5.40 multi-object inspector — an object list + a Details panel that reactively reflects a MULTI-selection: the properties common to every selected object, a 'Multiple Values' placeholder where they differ, and an edit that writes all selected at once (the Unreal Details multi-object core; VirtualSelect + CellValue substrate consumer)"
publish = false

[[bin]]
name = "hello-inspector"
path = "src/main.rs"

[dependencies]
# CellValue typed-value substrate (the 4th consumer after property-grid /
# data-grid / node-editor port defaults); the inspector reuses its
# parse / display / to_introspect / with_intervene wholesale.
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# R51.64 §5.40 — AccessKit substrate for the derived `Group` access node.
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
# R653 §5.16 — `#[pinion_derive::widget(...)]` emits the WidgetCore +
# WidgetA11y + WidgetView forwarding trio.
pinion-derive = { path = "../../crates/pinion-derive", version = "0.0.1" }
# R1249 §5.38 — the shared inline `TextField` paint / read / a11y helpers
# (`view_field` / `read_text_field_state` / `text_field_a11y_node`) for the
# Details numeric type-in editor (the property-grid inline-editor lift).
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R51.30 paint-side AppShell (pulls pinion-runtime/vello + pinion-rpc +
# winit transitively).
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R46.5 §5.16: the `HelloInspectorRenderer` struct emitted by `build.rs`
# names `::vello::*` directly.
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }
# Signal<Vec<ObjectData>> requires the model derive Serialize/Deserialize.
serde = { workspace = true }
# R922 — the `selection` query encodes the multi-select index set as a JSON
# array (mirroring `VirtualSelectExternal`'s `selection_value`).
serde_json = { workspace = true }

[dev-dependencies]
# R55.G.22 §5.49 — composite-paint-root-tag regression helper.
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
# R46.5 §5.16: build-time codegen for the Vello renderer wrapper.
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
