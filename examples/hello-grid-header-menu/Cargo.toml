[package]
name = "hello-grid-header-menu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R986 §5.27 §5.38 §5.53 data-grid column-header context menu: right-clicking a sortable column header opens a pinion own-rendered ContextMenu (Sort Ascending / Sort Descending / Clear Sort) anchored at the header; the chosen command applies to the right-clicked column. Composes R772 ContextMenuExternal + R887 secondary-click wire + R778 GridSortExternal + R775 view_virtual_table."
publish = false

[[bin]]
name = "hello-grid-header-menu"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
