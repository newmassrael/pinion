[package]
name = "hello-grid-multifilter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R997 §5.40 multi-facet predicate filter at scale: a 10,000-row virtualized data-grid whose AI-first column filter (invoke set_filter \"0~Alpha&1>=500&2=Active\") is a conjunction (AND) of per-column facets with ops (=/!=/~/</<=/>/>=), numeric-aware, composing with clickable sort headers and data-indexed selection. Generalizes the R783 single exact-match GridFilter; no new windowing substrate."
publish = false

[[bin]]
name = "hello-grid-multifilter"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
