[package]
name = "ai-introspect-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R39.4.3 dogfood: §5.32 locate + §5.33 overlay + §5.34 lifecycle + R46.3 Vello render path"
publish = false

[[bin]]
name = "ai-introspect-demo"
path = "src/main.rs"

[dependencies]
# Scene primitives + Color/Border style + hit_test for the in-process
# RPC call.
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
# R46.3.1 §5.16 paint_adapter Scene → vello::Scene walker. The `vello`
# feature flag enables the GPU paint primitive — previously the demo
# carried its own inline walker (build_vello_scene / fill_rect / ...);
# now it consumes the framework primitive so additional examples share
# one translation path.
pinion-runtime = { path = "../../crates/pinion-runtime", version = "0.0.1", features = ["vello"] }
# R47.3 §5.36 text shaping framework primitive. `paint_adapter::to_vello`
# now takes a `&mut LayoutCache` so every Vello consumer threads one in
# — even when, like this demo, the current scene tree carries zero
# `Scene::Text` nodes the cache is owned by App so the type checks
# without indirection.
pinion-text = { path = "../../crates/pinion-text", version = "0.0.1" }
# scene/locate typed dispatcher (we call directly, not through the
# JSON-RPC envelope, since this is in-process).
pinion-rpc = { path = "../../crates/pinion-rpc", version = "0.0.1" }
# inject_highlight / clear_highlights / OverlayEvent.
pinion-overlay = { path = "../../crates/pinion-overlay", version = "0.0.1" }
# Window + input. Matches the workspace pin used by hello-button.
winit = { workspace = true }
# R46.3 §5.16: Vello-backed GPU paint replaces softbuffer. The
# `DemoRenderer` struct emitted by `build.rs` references `vello::*` and
# `vello::wgpu::*` directly, so the binary needs vello at run-time.
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }
# Block on Vello's async `RenderContext::create_surface` at app boot —
# pinion-core/runtime are sync (§6.3); this example wraps the one-shot
# init future at the boundary so view-fn purity stays intact.
pollster = { workspace = true }
# R40.8 propose/apply payload: TypedProposal::SetSignal carries a
# serde_json::Value so the example needs the same json crate the RPC
# layer uses.
serde_json = { workspace = true }

[build-dependencies]
# R46.3 §5.16: build-time codegen for the `DemoRenderer` Vello wrapper.
# `build.rs` calls `compile_file` on `app.pinion.xml`; the emitted Rust
# is written to `$OUT_DIR/demo_renderer.rs` and `include!`d by main.rs
# (one-file-one-struct shape per R38 ratify).
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
