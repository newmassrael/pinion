[package]
name = "hello-menu-nested"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R985 §5.16 §5.38 §5.40 — cascading submenus over a MenuBarExternal. File > Open Recent > Older nests two levels; View > Appearance one; a submenu parent paints a trailing chevron and carries aria-haspopup=menu + aria-expanded. WAI-ARIA §3.16 cascade keyboard model (Arrow Right opens, Arrow Left / Escape closes one level)."
publish = false

[[bin]]
name = "hello-menu-nested"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
