[package]
name = "hello-grid-row-style"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R998 §5.40 per-row style rules at scale: a 10,000-row virtualized data-grid whose rows paint by declarative coloring rules (Wireshark/dlt-class). Each rule is a GridFilter predicate -> a tint; first match wins; AI-first invoke add_rule \"<filter>;<bg>;<fg>\". Reuses the R997 GridFilter; selection > rule > zebra precedence; no new windowing substrate."
publish = false

[[bin]]
name = "hello-grid-row-style"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
