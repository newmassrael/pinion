[package]
name = "hello-rotate-gesture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1433 §5.35 §5.15 — a native rotation gesture spins a gizmo. A widget that overrides External::rotation_gesture accumulates the incremental degrees of a two-finger trackpad twist (the toolkit native gesture event RotateNativeGesture) across the GesturePhase Begin..End arc, and discards the in-flight rotation on Cancel. winit exposes RotationGesture only on macOS/iOS, so the scene/rotation_gesture RPC is the AI-first driver (§2 #2): a headless client rotates the gizmo with no trackpad, drivable + introspectable."
publish = false

[[bin]]
name = "hello-rotate-gesture"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[dev-dependencies]
pinion-core = { path = "../../crates/pinion-core", features = ["test-fixtures"] }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
