[package]
name = "hello-measured-list"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1194 §5.27 measured variable-height list virtualization: rows whose per-row height is NOT known up-front but discovered by laying the row out (the layout-pass measurement round-trip). view_measured_list windows against a MeasuredHeights table that starts from an estimate and refines as the runtime harvests each rendered row's laid-out height back into MeasuredRowState; the scroll stays anchored (no jump) as rows above resolve estimate->measured. The TanStack Virtual measureElement / react-virtualized CellMeasurer capability."
publish = false

[[bin]]
name = "hello-measured-list"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R1194 §5.27 — `view_measured_list` windowed-list assembly + the
# `view_vertical_scrollbar` peer.
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
