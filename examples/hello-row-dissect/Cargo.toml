[package]
name = "hello-row-dissect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R1007 §5.27 §5.40 master-detail row dissection: pick a structured row up top, read its payload exploded into a recursive field tree below (Wireshark packet-detail / dlt message-detail). The new substrate dissect_row transduces a serde_json::Value into a DissectNode tree; the mature tree-nav + tree-paint machinery windows / collapses / navigates it. Master + detail rows are pointer-clickable via two TreeRowClickExternal routers; the RowDissectionExternal drives select/toggle/expand/collapse and introspects every visible node (name/value/kind/depth) without a pixel."
publish = false

[[bin]]
name = "hello-row-dissect"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
serde_json = { workspace = true }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
