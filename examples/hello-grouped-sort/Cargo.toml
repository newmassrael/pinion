[package]
name = "hello-grouped-sort"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R844 §5.27 §5.40 stacked Model/View proxies: a filter -> sort -> group chain over 10,000 rows. An upstream ViewSortFilterExternal sorts + filters; GroupOrderExternal groups its live order() into collapsible asset-type groups; selection (by source index) survives all three stages. Group-by over a mutable upstream order with a pointer-keyed memo."
publish = false

[[bin]]
name = "hello-grouped-sort"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
