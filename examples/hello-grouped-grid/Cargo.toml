[package]
name = "hello-grouped-grid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R845 §5.27 §5.40 grouped multi-column data grid: 10,000 rows in a 3-column grid (Name/Size/Modified) grouped by asset type, with collapsible group-header rows spanning the grid width. The 2nd structural consumer of the R843 group_rows flatten (list -> grid), virtualized, row-select by source index; WAI-ARIA grid a11y."
publish = false

[[bin]]
name = "hello-grouped-grid"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
