[package]
name = "hello-lazy-list"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "R924 §5.22 §5.23 §5.27 infinite-scroll virtualized lazy-load: a 10,000-row list that virtualizes the visible window (view_virtual_list) AND lazy-fetches each page asynchronously on scroll — an Effect on the scroll offset drives per-page Resource fetches through the shell-polled LocalTaskPump; not-yet-loaded rows render as skeletons, resolved rows as data. The genuine Model/View-at-scale backbone (asset browser / scene outliner over a paged async source)."
publish = false

[[bin]]
name = "hello-lazy-list"
path = "src/main.rs"

[dependencies]
pinion-core = { path = "../../crates/pinion-core", version = "0.0.1" }
pinion-a11y = { path = "../../crates/pinion-a11y", version = "0.0.1" }
pinion-shell = { path = "../../crates/pinion-shell", version = "0.0.1" }
# R744 §5.27 — `view_virtual_list` windowed-list assembly + the
# `view_vertical_scrollbar` peer.
pinion-widget-paint = { path = "../../crates/pinion-widget-paint", version = "0.0.1" }
# R1537 §5.16 — the emitted renderer owns its wgpu device through
# pinion-gpu (vello's RenderContext cannot carry TIMESTAMP_QUERY).
pinion-gpu = { path = "../../crates/pinion-gpu", version = "0.0.1" }
vello = { workspace = true }
# R924 — `Resource<Vec<AssetRow>, String>` per page requires the payload
# type to be (de)serializable; `AssetRow` derives serde.
serde = { workspace = true }

[build-dependencies]
pinion-forge = { path = "../../crates/pinion-forge", version = "0.0.1" }

[lints]
workspace = true
